<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoru — laporan server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%23191713'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='21' fill='%23faf8f4' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
<style>
/* Satu berkas, tanpa CDN dan tanpa unduhan huruf.
   Server yang dijaga Yoru belum tentu punya jalan keluar ke internet, dan
   halaman yang butuh unduhan dari luar akan tampil rusak justru di server
   yang paling perlu dijaga. */
:root{
  --kertas:#faf8f4; --panel:#f3efe7;
  --tinta:#191713; --samar:#6d665b; --pudar:#948b7d;
  --garis:#ded7ca; --rambut:#ebe5da;
  --aman:#2d6a41; --rawan:#a3382a; --tanya:#8a6512;
  --tanya-bg:#f7f0dd;
}
@media (prefers-color-scheme:dark){
  :root{
    --kertas:#15140f; --panel:#1e1c16;
    --tinta:#ece6da; --samar:#9b9385; --pudar:#736c60;
    --garis:#332f28; --rambut:#26231d;
    --aman:#84bb8d; --rawan:#e08c74; --tanya:#d9b264;
    --tanya-bg:#241f14;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--kertas);color:var(--tinta);
  font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
}
.sheet{max-width:700px;margin:0 auto;padding:48px 24px 96px}

/* ---------------- kepala ---------------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--tinta);padding-bottom:9px}
.wordmark{font:400 32px/1 Georgia,"Times New Roman",serif;letter-spacing:-.015em}
.wordmark span{color:var(--pudar)}
.head .when{font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--samar);padding-bottom:3px}
.machine{display:flex;gap:0;flex-wrap:wrap;margin-top:12px;
  font:12.5px/1.5 ui-monospace,Menlo,monospace;color:var(--samar)}
.machine span{padding-right:14px;margin-right:14px;border-right:1px solid var(--garis)}
.machine span:last-child{border-right:0;margin-right:0;padding-right:0}
.machine b{color:var(--tinta);font-weight:600}

/* ---------------- skor ---------------- */
.score{display:flex;align-items:flex-start;gap:22px;margin:30px 0 8px}
.score .fig{font:400 76px/.82 Georgia,"Times New Roman",serif;
  letter-spacing:-.035em;font-variant-numeric:lining-nums tabular-nums}
.score .say{padding-top:6px}
.score .say .lead{font-size:17px;line-height:1.45}
.tally{display:flex;flex-wrap:wrap;margin-top:9px;
  font:12.5px/1.5 ui-monospace,Menlo,monospace;color:var(--samar)}
.tally span{padding-right:13px;margin-right:13px;border-right:1px solid var(--garis)}
.tally span:last-child{border-right:0}
.tally b{font-weight:600}
.tally .ok b{color:var(--aman)} .tally .no b{color:var(--rawan)}

/* ---------------- bagian ---------------- */
section{margin-top:38px}
section > h2{font:600 15.5px/1.35 inherit;margin:0}
section > .lede{color:var(--samar);font-size:14px;margin:3px 0 0;max-width:56ch}

/* Garis punggung. Tiap baris menggantung di satu garis vertikal, dan
   penandanya duduk DI ATAS garis itu - jadi mata bisa menyusuri satu jalur
   dari atas ke bawah, bukan melompat antar kotak yang bentuknya sama semua. */
.ledger{margin:18px 0 0;padding-left:0;border-left:1px solid var(--garis)}
.entry{position:relative;padding:15px 0 16px 26px;border-bottom:1px solid var(--rambut)}
.entry:last-child{border-bottom:0}
.entry::before{
  content:"";position:absolute;left:-4px;top:22px;
  width:7px;height:7px;background:var(--pudar);
  border:2px solid var(--kertas);border-radius:1px;
}
.entry.ok::before{background:var(--aman)}
.entry.bad::before{background:var(--rawan)}
.entry.act::before{background:var(--tanya);width:9px;height:9px;left:-5px;top:21px}

/* Yang butuh jawaban dikasih bidang sendiri. Tanpa ini semua baris terlihat
   sama persis dan pemilik tidak tahu mana yang menunggu dia.
   Pemisah antar barisnya dinaikkan sekalian - di atas bidang bertinta, garis
   rambut jadi tidak kelihatan dan empat pertanyaan menyatu jadi satu blok. */
.entry.act{background:var(--panel);padding-left:26px;padding-right:16px;
  border-bottom-color:var(--garis)}
.entry.act + .entry.act{border-top:0}

.line{display:flex;gap:11px;align-items:baseline}
.line .title{font-weight:600;font-size:16px;flex:1;min-width:0}
.line .code{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--pudar);flex:none}
.state{font:600 11px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.05em;
  text-transform:uppercase;flex:none}
.state.ok{color:var(--aman)} .state.bad{color:var(--rawan)}
.state.mid{color:var(--samar)}
.why{color:var(--samar);font-size:14.5px;margin:6px 0 0;max-width:60ch}

/* Nilai dibikin dua kolom biar tidak membungkus berantakan. Nilai panjang
   seperti daftar algoritma SSH kalau ditulis mengalir jadi tidak terbaca. */
.pair{display:grid;grid-template-columns:74px 1fr;gap:1px 10px;margin-top:9px;
  font:12.5px/1.55 ui-monospace,Menlo,monospace}
.pair dt{color:var(--pudar)}
.pair dd{margin:0;color:var(--tinta);word-break:break-word}
.pair dd.was{color:var(--samar);text-decoration:line-through}

/* Kotak akibat. Aturan nomor 4 kontrak: WAJIB kelihatan tepat di sebelah
   tombol setuju - bukan di tooltip, bukan di halaman lain. Yang mencet harus
   sudah membaca akibatnya, jadi kotak ini sengaja dibikin lebih menarik
   perhatian daripada tombolnya sendiri. */
.warn{border-left:3px solid var(--tanya);background:var(--tanya-bg);
  padding:10px 13px;margin-top:13px}
.warn .cap{display:block;font-size:11.5px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;color:var(--tanya);margin-bottom:3px}
.warn p{margin:0;font-size:14.5px;line-height:1.55}
.block{border-left:3px solid var(--rawan);padding:8px 0 8px 13px;margin-top:13px}
.block .cap{display:block;font-size:11.5px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;color:var(--rawan);margin-bottom:3px}
.block p{margin:0;font-size:14.5px}

.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button{font:600 14px/1 inherit;padding:10px 16px;border-radius:2px;cursor:pointer;
  border:1px solid var(--garis);background:var(--kertas);color:var(--tinta)}
button:hover:not(:disabled){border-color:var(--samar)}
button.go{background:var(--tinta);color:var(--kertas);border-color:var(--tinta)}
button.go:hover:not(:disabled){opacity:.86}
button:disabled{opacity:.45;cursor:default}
.said{font-size:13.5px;color:var(--aman);margin-top:11px}
.said.bad{color:var(--rawan)}

.empty{margin-top:34px;padding-top:26px;border-top:1px solid var(--garis)}
.empty p{margin:0 0 10px}
.empty code{font:13.5px ui-monospace,Menlo,monospace;
  border-bottom:1px solid var(--garis)}
.foot{margin-top:46px;padding-top:14px;border-top:1px solid var(--garis);
  font-size:12.5px;line-height:1.6;color:var(--pudar);max-width:58ch}
</style>
</head>
<body>
<div class="sheet">
  <div class="head">
    <div class="wordmark">Yoru<span>.</span></div>
    <div class="when" id="when"></div>
  </div>
  <div class="machine" id="machine"><span>memuat…</span></div>
  <div id="body"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const elBody = document.getElementById('body');
const elMachine = document.getElementById('machine');
const elWhen = document.getElementById('when');
const elFoot = document.getElementById('foot');
let SERVER = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Status di kontrak ditulis untuk mesin. Yang baca halaman ini pemilik warung
// online, bukan sysadmin - jadi katanya diganti yang dia pakai sehari-hari.
// Artinya tidak digeser sedikit pun.
const LABEL = {
  LULUS:    ['aman',    'ok'],
  GAGAL:    ['rawan',   'bad'],
  SEBAGIAN: ['separuh', 'mid'],
  DILEWATI: ['lewat',   'mid'],
  ERROR:    ['?',       'mid'],
};

async function load() {
  let d;
  try {
    const r = await fetch('/api/laporan');
    if (r.status === 404) return blank();
    d = await r.json();
  } catch (e) { return blank('Halaman ini nggak bisa nyambung ke API-nya sendiri.'); }
  SERVER = d.server?.nama || null;
  render(d);
}

function blank(msg) {
  elMachine.innerHTML = '<span>belum ada server yang lapor</span>';
  elWhen.textContent = '';
  elBody.innerHTML = `<div class="empty">
    <p>${esc(msg || 'Belum ada laporan yang masuk ke sini.')}</p>
    <p>Jalanin agent-nya di server yang mau dijaga:</p>
    <p><code>sudo yoru-agent --siklus perbaikan</code></p></div>`;
  elFoot.textContent = '';
}

function render(d) {
  const r = d.ringkasan || {}, s = d.server || {};

  elWhen.textContent = (d.waktu || '').replace('T', ' ').slice(0, 16);
  elMachine.innerHTML =
    `<span><b>${esc(s.nama)}</b></span><span>${esc(s.os)}</span>` +
    `<span>${esc(s.ip_utama || 'ip tidak terbaca')}</span>` +
    (s.panel_terdeteksi ? `<span>${esc(s.panel_terdeteksi)}</span>` : '');

  // Angkanya harus menjumlah. "1 dari 10 aman, 7 rawan" bikin orang yang
  // teliti menghitung sisanya lalu bertanya-tanya dua yang lain ke mana.
  const tally = [`<span class="ok"><b>${r.lulus ?? 0}</b> aman</span>`];
  if (r.gagal)    tally.push(`<span class="no"><b>${r.gagal}</b> rawan</span>`);
  if (r.sebagian) tally.push(`<span><b>${r.sebagian}</b> separuh</span>`);
  if (r.dilewati) tally.push(`<span><b>${r.dilewati}</b> nggak kebaca</span>`);

  const drift = d.drift || [];
  const shown = new Set(drift.map(x => x.id));
  const need = new Set(d.butuh_keputusan || []);
  const ask  = (d.kontrol || []).filter(k => need.has(k.id) && !shown.has(k.id));
  const rest = (d.kontrol || []).filter(k => !need.has(k.id) && !shown.has(k.id));

  const verdict = (drift.length || ask.length)
    ? `Ada ${drift.length + ask.length} hal yang nunggu kamu.`
    : 'Nggak ada yang perlu kamu kerjain sekarang.';

  let h = `
  <div class="score">
    <div class="fig">${r.skor ?? 0}</div>
    <div class="say">
      <div class="lead">${esc(verdict)}</div>
      <div class="tally">${tally.join('')}</div>
    </div>
  </div>`;

  if (drift.length) {
    h += bagian('Ada yang berubah',
      'Setelan ini tadinya benar, sekarang nggak. Jawaban kamu di sini jadi patokan buat besok.',
      drift.map(rowDrift).join(''));
  }
  if (ask.length) {
    h += bagian('Nunggu jawaban kamu',
      'Yoru nggak ngerjain yang ini tanpa izin — ada layanan lain yang bisa ikut kena.',
      ask.map(k => rowControl(k, true)).join(''));
  }
  if (rest.length) {
    h += bagian('Sisanya',
      'Diperiksa juga. Yang rawan di sini dibenerin Yoru sendiri, soalnya nggak ada yang ikut kena.',
      rest.map(k => rowControl(k, false)).join(''));
  }

  elBody.innerHTML = h;
  elBody.querySelectorAll('button[data-id]').forEach(b =>
    b.addEventListener('click', () => send(b)));

  elFoot.textContent =
    `Siklus ${d.siklus}. Yoru ngecek ulang tiap hari dan nyatet semua tindakannya ` +
    `ke /var/log/yoru/ — catatan itu milik root, dan agent-nya sendiri nggak bisa ngedit. ` +
    `Halaman ini nggak pernah nyentuh server; dia cuma nampung jawaban kamu.`;
}

const bagian = (judul, lede, isi) =>
  `<section><h2>${esc(judul)}</h2><p class="lede">${esc(lede)}</p>
   <div class="ledger">${isi}</div></section>`;

function rowControl(k, act) {
  const [kata, warna] = LABEL[k.status] || ['?', 'mid'];
  const blocked = (k.prasyarat_gagal || []).length > 0;
  const kelas = act ? 'act' : (warna === 'ok' ? 'ok' : warna === 'bad' ? 'bad' : '');
  return `
  <div class="entry ${kelas}">
    <div class="line">
      <span class="state ${warna}">${esc(kata)}</span>
      <span class="title">${esc(k.nama)}</span>
      <span class="code">${esc(k.id)}</span>
    </div>
    <p class="why">${esc(k.kenapa)}</p>
    <dl class="pair">
      <dt>sekarang</dt><dd>${esc(k.nilai_terbaca)}</dd>
      <dt>target</dt><dd>${esc(k.nilai_target)}</dd>
    </dl>
    ${blocked ? `<div class="block"><span class="cap">Belum bisa dijalanin</span>
      <p>${esc(k.prasyarat_gagal.join(' · '))}</p></div>` : ''}
    ${act && !blocked ? `
      <div class="warn"><span class="cap">Kalau kamu setuju, ini yang ikut berubah</span>
        <p>${esc(k.yang_rusak_kalau_diterapkan)}</p></div>
      <div class="acts">
        <button class="go" data-id="${esc(k.id)}" data-nilai="setuju">Ya, benerin</button>
        <button data-id="${esc(k.id)}" data-nilai="tolak">Nanti dulu</button>
      </div>` : ''}
    ${k.hasil ? `<div class="said${k.hasil.berhasil ? '' : ' bad'}">${k.hasil.berhasil
        ? 'Udah dibenerin dan dicek ulang — sekarang ' + esc(k.hasil.nilai_sesudah) + '.'
        : 'Gagal: ' + esc(k.hasil.pesan_error || 'nggak diketahui') + '.'}</div>` : ''}
  </div>`;
}

function rowDrift(x) {
  const jejak = x.siapa
    ? `Diubah <b>${esc(x.siapa)}</b>${x.kapan_diubah ? ' ' + esc(x.kapan_diubah) : ''}` +
      `${x.perintah ? ' pakai <code>' + esc(x.perintah) + '</code>' : ''}.`
    : 'Nggak ada catatan siapa yang ngubah.';
  return `
  <div class="entry act">
    <div class="line">
      <span class="state bad">berubah</span>
      <span class="title">${esc(x.nama)}</span>
      <span class="code">${esc(x.id)}</span>
    </div>
    <dl class="pair">
      <dt>tadinya</dt><dd class="was">${esc(x.berubah_dari)}</dd>
      <dt>sekarang</dt><dd>${esc(x.berubah_jadi)}</dd>
    </dl>
    <p class="why">${jejak}</p>
    <div class="acts">
      <button data-id="${esc(x.id)}" data-nilai="sah">Itu emang saya</button>
      <button class="go" data-id="${esc(x.id)}" data-nilai="kembalikan">Balikin kayak semula</button>
    </div>
  </div>`;
}

async function send(btn) {
  const row = btn.closest('.entry');
  row.querySelectorAll('button').forEach(b => b.disabled = true);
  const note = document.createElement('div');
  try {
    const r = await fetch('/api/keputusan', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({server: SERVER, kontrol: btn.dataset.id,
                            nilai: btn.dataset.nilai})
    });
    if (!r.ok) throw new Error(await r.text());
    note.className = 'said';
    note.textContent = 'Kecatat. Yoru ngerjainnya pas pemeriksaan berikutnya.';
  } catch (e) {
    row.querySelectorAll('button').forEach(b => b.disabled = false);
    note.className = 'said bad';
    note.textContent = 'Gagal nyimpen jawaban kamu. Coba lagi.';
  }
  row.appendChild(note);
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
