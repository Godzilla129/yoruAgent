<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoru · Penjaga server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M16 6l7 3v5.5c0 4.2-2.8 7.6-7 8.9-4.2-1.3-7-4.7-7-8.9V9z' fill='none' stroke='%2334d399' stroke-width='1.8'/%3E%3C/svg%3E">
<style>
/* theme: every colour is a token on :root. Dark only redefines tokens, never adds
   one, so a control cannot vanish in one theme. No data-theme = follow the OS. */
:root{
  color-scheme: light;
  --bg:#f4f6fb;        --surface:#ffffff;   --surface-2:#f8fafc;
  --line:#e4e9f2;      --line-soft:#eef2f8;
  --text:#0b1220;      --muted:#5b6880;     --faint:#8a95a8;
  --side:#0b1220;      --side-2:#18233a;    --side-text:#aab6cc;  --side-on:#ffffff;
  --brand:#059669;     --brand-soft:#d1fae5;
  --pass:#047857;      --pass-bg:#d1fae5;
  --fail:#b91c1c;      --fail-bg:#fee2e2;
  --warn:#a16207;      --warn-bg:#fef3c7;
  --info:#0369a1;      --info-bg:#e0f2fe;
  --shadow:0 1px 2px rgba(11,18,32,.05), 0 4px 14px -10px rgba(11,18,32,.14);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#070b14;       --surface:#101828;   --surface-2:#0c1422;
    --line:#1f2a3d;     --line-soft:#18222f;
    --text:#e8edf7;     --muted:#93a1b8;     --faint:#6b7a90;
    --side:#0a101c;     --side-2:#18233a;    --side-text:#93a1b8;  --side-on:#ffffff;
    --brand:#34d399;    --brand-soft:#053a2c;
    --pass:#34d399;     --pass-bg:#06301f;
    --fail:#f87171;     --fail-bg:#3a1414;
    --warn:#fbbf24;     --warn-bg:#392a06;
    --info:#38bdf8;     --info-bg:#082f42;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 16px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#070b14;       --surface:#101828;   --surface-2:#0c1422;
  --line:#1f2a3d;     --line-soft:#18222f;
  --text:#e8edf7;     --muted:#93a1b8;     --faint:#6b7a90;
  --side:#0a101c;     --side-2:#18233a;    --side-text:#93a1b8;  --side-on:#ffffff;
  --brand:#34d399;    --brand-soft:#053a2c;
  --pass:#34d399;     --pass-bg:#06301f;
  --fail:#f87171;     --fail-bg:#3a1414;
  --warn:#fbbf24;     --warn-bg:#392a06;
  --info:#38bdf8;     --info-bg:#082f42;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 16px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
/* .picker sets display:flex, which would beat the hidden attribute */
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}

/* shell */
.wrap{display:flex;min-height:100vh}

.sidebar{width:224px;flex:none;background:var(--side);color:var(--side-text);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;
  color:#fff;font-weight:650;font-size:15.5px;letter-spacing:-.01em}
.brand .dot{width:26px;height:26px;border-radius:8px;flex:none;
  background:linear-gradient(140deg,#34d399,#0ea5e9);display:grid;place-items:center}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--side-text);letter-spacing:0}
.sidebar nav{padding:6px 10px;flex:1;overflow-y:auto}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:2px;
  color:var(--side-text);text-decoration:none;font-size:13.5px;cursor:pointer;
  border-radius:9px;transition:background .12s,color .12s}
.sidebar nav a:hover{background:var(--side-2);color:#fff}
.sidebar nav a.on{background:var(--side-2);color:var(--side-on);font-weight:600}
.sidebar nav a .ic{width:17px;display:grid;place-items:center;flex:none;opacity:.85;font-size:16px}
.sidebar nav a .pill{margin-left:auto;background:var(--fail);color:#fff;font-size:10.5px;
  font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.sidebar .foot{padding:13px 18px;border-top:1px solid var(--side-2);
  font-size:11.5px;color:var(--side-text);line-height:1.5;display:flex;gap:8px;align-items:center}

.main{flex:1;min-width:0;padding:16px 22px 52px}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:21px;margin:0;font-weight:650;letter-spacing:-.02em}
.page-head .meta{color:var(--muted);font-size:12.5px}
.head-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* server switcher + theme toggle */
.picker{display:flex;align-items:center;gap:7px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;
  box-shadow:var(--shadow)}
.picker select{border:0;background:transparent;color:inherit;font:inherit;
  max-width:190px;cursor:pointer;padding:1px 2px}
.picker .tag-local{font-size:10.5px;font-weight:700;letter-spacing:.03em;
  background:var(--brand-soft);color:var(--brand);padding:2px 6px;border-radius:5px}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer;
  box-shadow:var(--shadow);font-size:15px;line-height:1}
.icon-btn:hover{border-color:var(--brand)}

/* icons: one stroke set, drawn inline, so nothing is fetched from outside */
.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}

/* hero: the one answer the owner comes for - is my server safe? */
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:14px;box-shadow:var(--shadow);
  padding:20px 22px;margin-bottom:14px}
.hero .ring-wrap{position:relative;width:112px;height:112px;flex:none}
.hero .ring-num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  line-height:1}
.hero .ring-num b{font-size:30px;font-weight:720;letter-spacing:-.03em;display:block}
.hero .ring-num small{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.ring .track{stroke:var(--line)}
.ring .fill{stroke-linecap:round}
.ring.good .fill{stroke:var(--pass)} .ring.mid .fill{stroke:var(--warn)} .ring.bad .fill{stroke:var(--fail)}
.ring.grow .fill{animation:ringIn .9s cubic-bezier(.2,.8,.2,1)}
@keyframes ringIn{from{stroke-dasharray:0 999}}
.hero .say{flex:1;min-width:230px}
.hero h2{margin:0;font-size:21px;font-weight:680;letter-spacing:-.02em}
.hero .line{margin:4px 0 0;color:var(--muted);font-size:14px}
.hero .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  padding:4px 10px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line-soft)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.dot.p{background:var(--pass)} .dot.f{background:var(--fail)} .dot.n{background:var(--warn)}
.dot.x{background:var(--faint)}
.hero .facts{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.hero .facts span{display:inline-flex;align-items:center;gap:6px}
.hero .go{align-self:center}
.remote{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:12.5px;
  color:var(--info);background:var(--info-bg);border-radius:9px;padding:8px 11px;line-height:1.5}
.remote .i{margin-top:2px}

/* "Perlu jawabanmu": each question is its own card */
.asks{display:grid;gap:10px;padding:12px}
.ask{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;border:1px solid var(--line-soft);
  border-radius:12px;padding:13px 14px;background:var(--surface)}
.ask.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn-bg) 45%,var(--surface))}
.ask .badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:17px}
.badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.info{background:var(--info-bg);color:var(--info)}
.badge.fail{background:var(--fail-bg);color:var(--fail)}
.ask .body{flex:1;min-width:210px}
.ask .t{font-weight:640}
.ask .d{font-size:13px;color:var(--muted);line-height:1.6;margin-top:3px}
.ask .d b{color:var(--text);font-weight:600}
.ask .acts{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.was{background:var(--pass-bg);color:var(--pass);padding:1px 7px;border-radius:6px;font-weight:600}
.now{background:var(--fail-bg);color:var(--fail);padding:1px 7px;border-radius:6px;font-weight:600}
.evidence{margin-top:6px;font-size:12px;color:var(--faint);line-height:1.6}
details.why{margin-top:6px;font-size:12.5px;color:var(--muted)}
details.why summary{cursor:pointer;color:var(--brand);font-weight:600;width:max-content;list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why p{margin:6px 0 0;line-height:1.6}
.count{font-size:11px;font-weight:700;background:var(--fail);color:#fff;border-radius:10px;
  padding:1px 7px;min-width:20px;text-align:center}

/* the ten checks: one row each, details on click */
.group-lbl{font-size:11.5px;font-weight:650;color:var(--faint);letter-spacing:.04em;
  text-transform:uppercase;padding:12px 16px 4px}
.ctl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;
  background:transparent;padding:11px 16px;cursor:pointer;border-top:1px solid var(--line-soft);
  transition:background .12s}
.group-lbl + .ctl{border-top:0}
.ctl:hover{background:var(--surface-2)}
.st{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:16px}
.st.p{background:var(--pass-bg);color:var(--pass)} .st.f{background:var(--fail-bg);color:var(--fail)}
.st.n{background:var(--warn-bg);color:var(--warn)} .st.x{background:var(--surface-2);color:var(--faint)}
.ctl-main{flex:1;min-width:0}
.ctl .nm{display:block;font-weight:600}
.ctl .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl .sub.warn{color:var(--warn)}
.ctl .chev{color:var(--faint);font-size:17px}
.tag{display:inline-block;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:20px;
  white-space:nowrap}
.tag.p{background:var(--pass-bg);color:var(--pass)}
.tag.f{background:var(--fail-bg);color:var(--fail)}
.tag.n{background:var(--warn-bg);color:var(--warn)}
.tag.x{background:var(--surface-2);color:var(--muted)}
.result{display:block;margin-top:6px;font-size:12px;line-height:1.5;white-space:normal}
.result:empty{display:none}
.result.ok{color:var(--pass)} .result.bad{color:var(--fail)}
.result.wait{color:var(--warn)} .result.busy{color:var(--muted)}

/* detail panel: slides in from the right, from the bottom on a phone */
dialog.drawer{margin:0 0 0 auto;height:100%;max-height:100%;width:min(460px,100vw);max-width:100vw}
dialog.drawer[open]{animation:slideIn .22s ease-out}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}}
.dr{background:var(--surface);color:var(--text);height:100%;overflow-y:auto;
  border-left:1px solid var(--line);padding:20px 20px 28px}
.dr .top{display:flex;gap:12px;align-items:flex-start}
.dr h3{margin:0;font-size:17px;font-weight:680;letter-spacing:-.01em;flex:1}
.dr .close{background:transparent;border:0;cursor:pointer;color:var(--muted);font-size:20px;padding:2px}
.dr .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.cmp div{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:9px 11px}
.cmp small{display:block;font-size:11px;color:var(--faint);font-weight:650;letter-spacing:.03em;
  text-transform:uppercase}
.cmp b{display:block;font-weight:600;margin-top:2px}
.cmp code{display:block;margin-top:3px;color:var(--faint);font-size:11px;word-break:break-all}
.dr h4{margin:18px 0 4px;font-size:13px;font-weight:650}
.dr p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.65}
.box{margin-top:14px;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6}
.box b{display:block;font-size:12px;margin-bottom:2px}
.box.warn{background:var(--warn-bg);color:var(--warn)} .box.info{background:var(--info-bg);color:var(--info)}
.dr .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:20px}
.dr .acts .btn{padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.dr .ref{margin-top:20px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:11.5px;
  color:var(--faint);line-height:1.6}

/* toast: a short confirmation that does not push the page around */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:50;
  background:var(--text);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:13px;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.4);transition:opacity .2s,transform .2s;pointer-events:none;
  max-width:min(460px,90vw)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* loading placeholder instead of the word "memuat" */
.sk{background:linear-gradient(90deg,var(--line-soft),var(--surface-2),var(--line-soft));
  background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:13px;overflow:hidden}
.panel > .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.panel > .head h2{font-size:14.5px;margin:0;font-weight:650;letter-spacing:-.01em}
.panel > .head .note{font-size:12px;color:var(--muted);font-weight:400}
.panel > .head .bulk{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.panel.urgent{border-color:color-mix(in srgb, var(--fail) 40%, var(--line))}
.panel.urgent > .head{background:var(--fail-bg)}
.panel.urgent > .head h2{color:var(--fail)}
.panel-body{padding:14px 16px}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{color:var(--text);display:block;margin-bottom:5px;font-size:14.5px}
.empty code{background:var(--surface-2);border:1px solid var(--line);
  padding:3px 7px;border-radius:6px;display:inline-block;margin-top:9px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;
  padding:4px 10px;font-size:12px;font-weight:550;cursor:pointer;
  transition:border-color .12s,background .12s,color .12s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#04231a;font-weight:650}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#04231a}
.btn.danger{color:var(--muted);border-color:color-mix(in srgb,var(--fail) 18%,var(--line))}
.btn.danger:hover:not(:disabled){background:var(--fail-bg);border-color:var(--fail);color:var(--fail)}
.btn.ghost{background:transparent}

.btn.now { animation: rise .22s ease-out }
@keyframes rise { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .btn.now { animation: none } }

/* ports */
.ports{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.port{display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:7px 9px 7px 11px}
.port .n{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:650}
.port .proc{font-size:12px;color:var(--muted)}
.said{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6}

/* history */
.chart{width:100%;height:190px;display:block}
.chart .bar{fill:var(--brand);opacity:.85}
.chart .bar:hover{opacity:1}
.chart .grid{stroke:var(--line-soft)}
.chart .lbl{fill:var(--faint);font-size:9.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);
  padding:0 16px 14px}

/* logs */
.logbox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;line-height:1.75;max-height:65vh;overflow:auto;padding:10px 4px}
.logbox > div{padding:5px 12px;border-bottom:1px solid var(--line-soft);
  display:flex;gap:9px;flex-wrap:wrap;align-items:baseline}
.logbox > div:last-child{border-bottom:0}
.logbox .w{color:var(--faint);white-space:nowrap}
.logbox .s{font-weight:700;font-size:10.5px;letter-spacing:.04em;padding:1px 6px;
  border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.logbox .s.LULUS,.logbox .s.DIKEMBALIKAN,.logbox .s.DISIMPAN{background:var(--pass-bg);color:var(--pass)}
.logbox .s.GAGAL,.logbox .s.ERROR{background:var(--fail-bg);color:var(--fail)}
.logbox .s.DITOLAK,.logbox .s.PERINGATAN{background:var(--warn-bg);color:var(--warn)}
.logbox .msg{color:var(--muted);flex:1;min-width:180px}

/* forms */
.form{padding:16px;max-width:660px}
.form .intro{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.65}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:620;margin-bottom:5px}
.field label .mark{font-weight:400;color:var(--muted)}
.field input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  font:inherit;background:var(--surface-2);color:inherit}
.field input:focus{background:var(--surface)}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}
.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.note{margin-top:12px;font-size:12.5px;line-height:1.6}
.note.ok{color:var(--pass)} .note.bad{color:var(--fail)} .note.busy{color:var(--muted)}
.note.wait{color:var(--warn)} .note.status{margin:0 0 16px}
.footnote{padding-top:16px;margin-top:16px;border-top:1px solid var(--line-soft);
  font-size:11.5px;color:var(--faint);line-height:1.6}

/* dialogs */
dialog{border:0;padding:0;background:transparent;max-width:min(560px,92vw)}
dialog::backdrop{background:rgba(6,10,20,.62);backdrop-filter:blur(2px)}
.dlg{background:var(--surface);color:var(--text);border:1px solid var(--line);
  border-radius:15px;padding:20px 21px;box-shadow:0 24px 60px -16px rgba(0,0,0,.5)}
.dlg h3{margin:0;font-size:16.5px;font-weight:650;letter-spacing:-.01em}
.dlg .kid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
  color:var(--muted);margin-top:5px}
.dlg p{color:var(--muted);font-size:13.5px;line-height:1.65}
.risk{background:var(--warn-bg);border-radius:10px;padding:11px 13px;margin-top:13px}
.risk b{font-size:12px;color:var(--warn);text-transform:uppercase;letter-spacing:.04em}
.risk p{margin:5px 0 0;color:var(--text);font-size:13px}
.dlg .buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:17px;flex-wrap:wrap}
.dlg input{width:100%;margin-top:12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:9px;font:inherit;background:var(--surface-2);color:inherit}
.steps{list-style:none;padding:0;margin:14px 0 0;font-size:13px}
.steps li{padding:5px 0 5px 24px;position:relative;color:var(--muted)}
.steps li::before{content:"○";position:absolute;left:4px;color:var(--faint)}
.steps li.on{color:var(--text)}
.steps li.on::before{content:"◉";color:var(--brand)}
.cmd{margin-top:13px;background:var(--side);color:#9ff5d3;border-radius:9px;
  padding:9px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  overflow-x:auto;white-space:nowrap}
.clock{margin-top:9px;font-size:12px;color:var(--muted)}
.reply{margin-top:13px;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.6}
.reply.ok{background:var(--pass-bg);color:var(--pass)}
.reply.bad{background:var(--fail-bg);color:var(--fail)}
.reply.wait{background:var(--warn-bg);color:var(--warn)}

/* bulk & liveness */
.steps li.done::before{content:"●";color:var(--pass)}
.steps li.fail::before{content:"●";color:var(--fail)}
.steps li.hold::before{content:"●";color:var(--warn)}
.steps li .r{color:var(--muted);font-size:12px}
.steps li.done .r{color:var(--pass)} .steps li.fail .r{color:var(--fail)}
.steps li.hold .r{color:var(--warn)}

.beat{width:7px;height:7px;border-radius:50%;background:var(--pass);flex:none;
  animation:beat 2.4s ease-in-out infinite}
.beat.off{background:var(--fail);animation:none}
@keyframes beat{0%,100%{opacity:.35}50%{opacity:1}}

.delta{font-size:12px;font-weight:650;margin-left:7px}
.delta.up{color:var(--pass)} .delta.down{color:var(--fail)}
@media (prefers-reduced-motion: reduce){.beat{animation:none}}

/* narrow: below 900px the sidebar becomes a top bar; below 640px the detail
   panel comes up from the bottom, like a phone sheet. */
@media (max-width: 900px){
  .wrap{flex-direction:column}
  .sidebar{width:auto;height:auto;position:static;flex-direction:row;align-items:center;
    gap:6px;padding:0 10px;overflow-x:auto}
  .brand{padding:12px 8px 12px 4px;font-size:14px;white-space:nowrap}
  .brand small{display:none}
  .sidebar nav{display:flex;padding:6px 0;gap:4px;flex:1}
  .sidebar nav a{margin:0;white-space:nowrap;padding:8px 10px}
  .sidebar nav a .ic{display:none}
  .sidebar .foot{display:none}
  .main{padding:16px 14px 48px}
}
@media (max-width: 640px){
  .page-head h1{font-size:19px}
  .head-right{width:100%;margin-left:0}
  .picker{flex:1}
  .picker select{max-width:none;flex:1}
  .hero{padding:16px;gap:14px}
  .hero .ring-wrap{width:92px;height:92px}
  .hero .ring-num b{font-size:25px}
  .hero .go{width:100%}
  .ctl{padding:11px 12px;gap:10px}
  .ctl .tag{display:none}
  .panel > .head .bulk{margin-left:0;width:100%}
  dialog.drawer{margin:auto 0 0;height:auto;max-height:88vh;width:100vw}
  dialog.drawer[open]{animation:slideUp .22s ease-out}
  .dr{border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;max-height:88vh}
  .cmp{grid-template-columns:1fr}
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}
</style>
</head>
<body>

<div class="wrap">
  <aside class="sidebar">
    <div class="brand">
      <span class="dot">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#04231a"
             stroke-width="2.4" stroke-linejoin="round"><path d="M12 3l8 3.5V12c0 4.8-3.3 8.7-8 10-4.7-1.3-8-5.2-8-10V6.5z"/></svg>
      </span>
      <span>Yoru<small>penjaga server</small></span>
    </div>
    <nav id="nav">
      <a data-h="dashboard" class="on"><span class="ic" data-icon="home"></span>Beranda</a>
      <a data-h="history"><span class="ic" data-icon="history"></span>Riwayat</a>
      <a data-h="settings"><span class="ic" data-icon="sliders"></span>Setelan</a>
    </nav>
    <div class="foot"><span class="beat" id="pulseDot"></span><span id="pulseText">menyambung…</span></div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 id="pageTitle">Beranda</h1>
        <span class="meta" id="meta"></span>
      </div>
      <div class="head-right">
        <div class="picker" id="serverPicker" hidden>
          <span style="color:var(--muted)">Server</span>
          <select id="serverSelect" aria-label="Pilih server"></select>
          <span class="tag-local" id="localTag" hidden>MESIN INI</span>
        </div>
        <button class="icon-btn" id="themeBtn" title="Ganti tema" aria-label="Ganti tema"></button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<dialog id="dlgCtl" class="drawer"><form method="dialog" class="dr" id="ctlBody"></form></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlgConfirm"><form method="dialog" class="dlg">
  <h3 id="confirmTitle"></h3>
  <div class="kid" id="confirmKid"></div>
  <p id="confirmWhy"></p>
  <div class="risk"><b>Kalau disetujui, ini yang ikut berubah</b><p id="confirmRisk"></p></div>
  <div class="buttons">
    <button class="btn" value="batal">Batal</button>
    <button class="btn primary" value="ya" id="confirmGo">Ya, amankan</button>
  </div>
</form></dialog>

<dialog id="dlgRun"><form method="dialog" class="dlg">
  <h3 id="runTitle"></h3>
  <div class="kid" id="runKid"></div>
  <ul class="steps" id="runSteps"></ul>
  <div class="cmd" id="runCmd"></div>
  <div class="clock" id="runClock"></div>
  <div class="reply" id="runReply" hidden></div>
  <div class="buttons">
    <button class="btn" value="log" id="runLog" hidden>Lihat log</button>
    <button class="btn primary" value="tutup" id="runClose">Tutup</button>
  </div>
</form></dialog>

<dialog id="dlgToken"><form method="dialog" class="dlg">
  <h3>Server ini minta token</h3>
  <p>Dashboard ini dibuka dari komputer lain, jadi perlu token dulu. Tokennya ada di
     server itu, di <code>/etc/yoru/yoru.conf</code> baris <b>DASHBOARD_TOKEN</b>.</p>
  <input id="tokenInput" type="password" autocomplete="off" placeholder="tempel token di sini">
  <div class="buttons">
    <button class="btn" value="batal">Batal</button>
    <button class="btn primary" value="ya">Simpan</button>
  </div>
</form></dialog>

<script>
// UI text stays Indonesian - it is what the server owner reads. Identifiers,
// API paths and JSON fields are English; the four action verbs are not.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let DATA = null;            // the report currently on screen
let PAGE = 'dashboard';
let LOG_KID = null;         // which control's log to show, null = all of them
let SERVERS = [];           // every server that has reported to this dashboard
let PICKED = null;          // the one being looked at; null = whatever is newest
let LOCAL = null;           // the server name of THIS machine, from /api/servers

// Bumped by every render. A page function re-checks it after awaiting a fetch
// and gives up if it moved - the owner has navigated away since.
let RENDER = 0;
let LAST_SCORE = null;     // to show what the score just did, not only where it is
let liveTimer = null;

/* icons: paths in the style of the Lucide set (24x24, 2px stroke). Text glyphs
   like ◐ rendered as half a shape on some fonts, so every icon is an SVG. */
const ICONS = {
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  sliders: '<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
  monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
  half: '<circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"/>',
  minus: '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>',
  question: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  calendar: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  chevron: '<path d="m9 18 6-6-6-6"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  plug: '<path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  undo: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8"/>',
  swap: '<path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/>',
};
const I = name => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = I(el.dataset.icon));

/* theme: three states; "sistem" stores nothing and lets the OS decide. */
const THEMES = ['sistem', 'terang', 'gelap'];
const THEME_ICON = {sistem: 'monitor', terang: 'sun', gelap: 'moon'};
const THEME_NAME = {sistem: 'ikut sistem', terang: 'terang', gelap: 'gelap'};

function readTheme() {
  try { return THEMES.includes(localStorage.getItem('yoru-tema'))
    ? localStorage.getItem('yoru-tema') : 'sistem'; } catch (e) { return 'sistem'; }
}
function applyTheme(t) {
  if (t === 'sistem') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t === 'gelap' ? 'dark' : 'light');
  $('themeBtn').innerHTML = I(THEME_ICON[t]);
  $('themeBtn').title = `Tema: ${THEME_NAME[t]}. Klik untuk ganti`;
}
applyTheme(readTheme());
$('themeBtn').onclick = () => {
  const next = THEMES[(THEMES.indexOf(readTheme()) + 1) % THEMES.length];
  try { localStorage.setItem('yoru-tema', next); } catch (e) {}
  applyTheme(next);
  if (PAGE === 'history') render();   // the chart is drawn with theme colours
};

/* token: never asked from 127.0.0.1. From another machine it is asked once and
   forgotten when the tab closes. */
let TOKEN = (() => { try { return sessionStorage.getItem('yoru-token') || ''; } catch (e) { return ''; } })();

function askToken() {
  return new Promise(done => {
    const d = $('dlgToken');
    d.onclose = () => {
      if (d.returnValue !== 'ya') return done(false);
      TOKEN = $('tokenInput').value.trim();
      try { sessionStorage.setItem('yoru-token', TOKEN); } catch (e) {}
      done(!!TOKEN);
    };
    $('tokenInput').value = TOKEN;
    d.showModal();
  });
}

// Every API call goes through these two, so 401/403 handling lives in one place.
async function post(url, body) {
  const opts = () => ({
    method: 'POST',
    headers: Object.assign({'Content-Type': 'application/json'},
                           TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {}),
    body: JSON.stringify(body)
  });
  let r = await fetch(url, opts());
  if ((r.status === 401 || r.status === 403) && await askToken()) r = await fetch(url, opts());
  return r;
}
async function get(url) {
  const opts = () => ({headers: TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {}});
  let r = await fetch(url, opts());
  if ((r.status === 401 || r.status === 403) && await askToken()) r = await fetch(url, opts());
  return r;
}

// The report's status codes stay as they are; these are the words shown for them.
const TAG = {LULUS:['Aman','p'], GAGAL:['Perlu dibenahi','f'], SEBAGIAN:['Setengah jalan','n'],
             DILEWATI:['Dilewati','x'], ERROR:['Gagal dibaca','x']};

const PAGE_TITLE = {dashboard:'Beranda', history:'Riwayat', settings:'Setelan'};

const shorten = t => {
  const s = String(t || '');
  if (s.startsWith('TIDAK_ADA')) return 'di luar CIS L1';
  return s.length > 22 ? s.slice(0, 21) + '…' : s;
};
// 2026-09-08T03:00:12+07:00 -> 8 Sep 2026, 03:00 WIB. Read from the string
// itself, so it shows the server's own clock, not the browser's.
const MONTHS = 'Jan Feb Mar Apr Mei Jun Jul Agu Sep Okt Nov Des'.split(' ');
const ZONES = {'+07:00': 'WIB', '+08:00': 'WITA', '+09:00': 'WIT', 'Z': 'UTC', '+00:00': 'UTC'};
const when = t => {
  const m = String(t || '').match(/^(\d{4})-(\d\d)-(\d\d)[T ](\d\d):(\d\d)(?::[\d.]+)?(Z|[+-]\d\d:\d\d)?/);
  if (!m) return String(t || '');
  const zone = m[6] ? ' ' + (ZONES[m[6]] || 'UTC' + m[6]) : '';
  return `${Number(m[3])} ${MONTHS[Number(m[2]) - 1]} ${m[1]}, ${m[4]}:${m[5]}${zone}`;
};

// Is the report on screen from this very machine? Only then do the
// Audit/Hardening/Rollback buttons mean anything - they run yoructl HERE.
const isLocal = () => !LOCAL || !DATA || (DATA.server && DATA.server.name === LOCAL);

/* loading */
async function loadServers() {
  try {
    const r = await get('/api/servers');
    if (!r.ok) return;
    const j = await r.json();
    SERVERS = j.servers || [];
    LOCAL = j.local || null;
  } catch (e) { /* the picker simply does not appear */ }
}

// The 30-second refresh redraws only when the report really changed, so an
// open "Kenapa?" or a half-read card does not jump shut under the owner.
let LAST_RAW = null;
async function load(force) {
  const q = PICKED ? `?server=${encodeURIComponent(PICKED)}` : '';
  let raw = null;
  try {
    const r = await get('/api/report' + q);
    raw = (r.status === 404 || !r.ok) ? null : await r.text();
    pulse(true);
  } catch (e) {
    // A network blip keeps the last report on screen instead of blanking it.
    pulse(false);
    if (DATA) return;
  }
  if (!force && raw === LAST_RAW && PAGE === 'dashboard' && DATA) return tickTimes();
  LAST_RAW = raw;
  try { DATA = raw ? JSON.parse(raw) : null; } catch (e) { DATA = null; }
  render();
}

// Bottom of the sidebar: is this page still talking to the dashboard?
function pulse(ok) {
  $('pulseDot').className = 'beat' + (ok ? '' : ' off');
  const now = new Date();
  $('pulseText').textContent = ok
    ? `Tersambung · diperbarui ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`
    : 'Nggak tersambung ke dashboard';
}

function drawPicker() {
  // Shown only when there is more than one server to pick from. Not on
  // Setelan: those settings belong to this machine whatever is picked.
  if (SERVERS.length < 2 || PAGE === 'settings') { $('serverPicker').hidden = true; return; }
  $('serverPicker').hidden = false;
  const current = (DATA && DATA.server && DATA.server.name) || PICKED || '';
  $('serverSelect').innerHTML = SERVERS.map(s =>
    `<option value="${esc(s.name)}" ${s.name === current ? 'selected' : ''}>${esc(s.name)}</option>`
  ).join('');
  $('localTag').hidden = !(current && current === LOCAL);
}
// Another server's score is not a change of this one's, so the +/- starts over.
$('serverSelect').onchange = e => { PICKED = e.target.value; LAST_SCORE = null; load(true); };

/* render */
function render() {
  const gen = ++RENDER;
  $('pageTitle').textContent = PAGE_TITLE[PAGE];
  document.querySelectorAll('#nav a').forEach(a =>
    a.classList.toggle('on', a.dataset.h === PAGE));
  drawPicker();
  markBadge();

  if (PAGE !== 'dashboard') clearInterval(liveTimer);
  if (PAGE === 'settings') return settingsPage(gen);
  if (PAGE === 'history')  return historyPage(gen);

  if (!DATA) return emptyState();

  const s = DATA.server || {};
  $('pageTitle').textContent = s.name || PAGE_TITLE[PAGE];
  $('meta').textContent = [s.os, s.primary_ip, s.detected_panel].filter(Boolean).join(' · ');

  $('content').innerHTML = hero() + askPanel() + controlList();
  wireButtons();
  watchLive();
}

// Everything the owner has to answer: approvals, changed settings, open ports.
function waitingCount() {
  if (!DATA) return 0;
  return (DATA.pending_decisions || []).length + (DATA.drift || []).length
         + pendingPorts().ports.length;
}

// The red number beside "Beranda": how many things wait on the owner.
function markBadge() {
  const waiting = waitingCount();
  const a = document.querySelector('#nav a[data-h="dashboard"]');
  const old = a.querySelector('.pill');
  if (old) old.remove();
  if (waiting > 0) {
    const pill = document.createElement('span');
    pill.className = 'pill';
    pill.textContent = waiting;
    a.appendChild(pill);
  }
}

// Grey blocks in the shape of what is coming, instead of the word "memuat".
function skeleton(...heights) {
  return heights.map(h => `<div class="sk" style="height:${h}px;margin-bottom:14px"></div>`).join('');
}

function emptyState() {
  $('meta').textContent = '';
  $('content').innerHTML = `<div class="panel"><div class="empty">
    <b>Belum ada laporan yang masuk.</b>
    Laporan pertama muncul setelah Yoru mengecek server. Mau sekarang? Jalankan:
    <code>sudo -u yoru-agent /opt/yoru/bin/yoru-agent --siklus perbaikan</code></div></div>`;
}

/* words for values. yoructl reports what it read (no, 3/30, aturan=12...);
   these say it in plain words. Anything not listed is shown as it came. */
const PLAIN = {
  K01: {'no': 'root nggak bisa login lewat SSH', 'yes': 'root bisa login pakai password',
        'without-password': 'root masih bisa login pakai kunci SSH',
        'prohibit-password': 'root masih bisa login pakai kunci SSH',
        'forced-commands-only': 'root cuma boleh menjalankan perintah tertentu'},
  K02: {'no': 'login pakai password mati', 'yes': 'login pakai password masih nyala'},
  K04: {'mac_sha1=0': 'tanpa algoritma lemah (sha1)', 'mac_sha1=1': 'masih ada algoritma lemah (sha1)'},
  K05: {'active': 'firewall nyala', 'inactive': 'firewall mati', 'tidak-aktif': 'firewall mati'},
  K07: {'enabled': 'pembaruan otomatis nyala', 'disabled': 'pembaruan otomatis mati',
        'tidak-terpasang': 'belum terpasang'},
  K10: {'1/0/0': '3 dari 3 setelan sesuai', '1/0/na': 'setelan sesuai (tanpa IPv6)'},
};
function plain(kid, value) {
  const v = String(value ?? '').trim();
  if (!v) return '-';
  if (v === 'tidak-terbaca') return 'nggak kebaca';
  const map = PLAIN[kid] || {};
  if (map[v]) return map[v];
  let m;
  if (kid === 'K05' && (m = v.match(/^(active|inactive)\b(.*)$/))) return map[m[1]] + m[2];
  if (kid === 'K03' && (m = v.match(/^(\d+)\/(\d+)$/)))
    return `boleh salah ${m[1]} kali, waktu login ${m[2]} detik`;
  if (kid === 'K08' && (m = v.match(/^aturan(>=|=)(\d+)$/)))
    return `${m[1] === '>=' ? 'minimal ' : ''}${m[2]} aturan audit aktif`;
  if (kid === 'K09' && (m = v.match(/^max ([\d.]+)([KMGT])$/)))
    return `log disimpan, batas ${Number(m[1])} ${m[2]}B`;
  if (kid === 'K10' && (m = v.match(/^(\S)\/(\S)\/(\S+)$/))) {
    // log_martians must be 1, secure_redirects 0, accept_ra 0 (or absent: no IPv6)
    const off = [m[1] !== '1', m[2] !== '0', !['0', 'na'].includes(m[3])].filter(Boolean).length;
    return `${3 - off} dari 3 setelan sesuai`;
  }
  if ((m = v.match(/^(?:0\.0\.0\.0|\*|\[::\]):(\d+)$/))) return `port ${m[1]} terbuka ke semua jaringan`;
  if ((m = v.match(/^(?:127\.0\.0\.1|localhost|\[::1\]):(\d+)$/))) return `port ${m[1]} cuma untuk server ini`;
  return v;
}

const CATEGORY = {ssh: 'Akses SSH', firewall: 'Firewall', jaringan: 'Jaringan',
                  audit: 'Jejak audit', log: 'Log', pembaruan: 'Pembaruan'};
const STATUS_ICON = {p: 'check', f: 'alert', n: 'half', x: 'minus'};
const firstSentence = t => (String(t || '').match(/^.*?[.!?](?=\s|$)/) || [String(t || '')])[0];

// "20 hari lalu". Kept in data-ago, so tickTimes() can refresh it without a redraw.
function ago(t) {
  const ms = Date.now() - new Date(t).getTime();
  if (!isFinite(ms)) return '';
  const min = Math.round(ms / 60000);
  if (min < 1) return 'baru saja';
  if (min < 60) return `${min} menit lalu`;
  if (min < 60 * 24) return `${Math.round(min / 60)} jam lalu`;
  return `${Math.round(min / 1440)} hari lalu`;
}
function tickTimes() {
  document.querySelectorAll('[data-ago]').forEach(el => el.textContent = ago(el.dataset.ago));
}

function ring(pct, band, grow) {
  const r = 48, c = 2 * Math.PI * r;
  return `<svg class="ring ${band}${grow ? ' grow' : ''}" width="100%" height="100%" viewBox="0 0 112 112">
    <circle class="track" cx="56" cy="56" r="${r}" fill="none" stroke-width="10"/>
    <circle class="fill" cx="56" cy="56" r="${r}" fill="none" stroke-width="10"
      stroke-dasharray="${(c * pct / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 56 56)"/>
  </svg>`;
}

/* hero: one sentence first, numbers after */
function hero() {
  const s = DATA.summary || {};
  const score = s.score ?? 0;
  const waiting = waitingCount();
  const failed = (s.failed ?? 0) + (s.partial ?? 0);
  const band = score >= 80 ? 'good' : score >= 50 ? 'mid' : 'bad';
  const title = failed === 0 && waiting === 0 ? 'Server kamu aman'
              : band === 'good' ? 'Server kamu cukup aman'
              : band === 'mid' ? 'Server kamu masih ada celah' : 'Server kamu masih rawan';
  const line = [waiting ? `${waiting} hal nunggu jawabanmu` : '',
                failed ? `${failed} pemeriksaan masih perlu dibenahi` : ''].filter(Boolean).join(', ');

  // Animate the ring on the first draw and when the score moves, not on every refresh.
  const diff = (LAST_SCORE === null || LAST_SCORE === score) ? 0 : score - LAST_SCORE;
  const grow = LAST_SCORE === null || diff !== 0;
  LAST_SCORE = score;
  const delta = diff ? `<span class="delta ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : ''}${diff}</span>` : '';

  const chip = (n, cls, label) => `<span class="chip"><span class="dot ${cls}"></span>${n} ${label}</span>`;
  const chips = chip(s.passed ?? 0, 'p', 'aman') + chip(s.failed ?? 0, 'f', 'perlu dibenahi')
    + (s.partial ? chip(s.partial, 'n', 'setengah jalan') : '')
    + (s.skipped ? chip(s.skipped, 'x', 'dilewati') : '');

  const local = isLocal();
  const facts = [
    `<span>${I('clock')} Dicek ${esc(when(DATA.time))} · <span data-ago="${esc(DATA.time)}">${ago(DATA.time)}</span></span>`,
    local && SCHEDULE ? `<span>${I('calendar')} Cek harian jam ${esc(SCHEDULE)}</span>` : '',
    local ? `<span id="lastAct"></span>` : '',
  ].join('');

  const remote = local ? '' : `<div class="remote">${I('swap')}<span>Ini laporan dari
    <b>${esc((DATA.server || {}).name || 'server lain')}</b>. Menyetujui dan menjawab port tetap bisa.
    Tombol Cek ulang, Amankan dan Kembalikan cuma jalan di server tempat dashboard ini dipasang.</span></div>`;

  return `<section class="hero">
    <div class="ring-wrap">${ring(score, band, grow)}
      <div class="ring-num"><div><b>${score}</b><small>dari 100${delta}</small></div></div></div>
    <div class="say">
      <h2>${title}</h2>
      <p class="line">${line ? esc(line) + '.' : 'Semua pemeriksaan sudah aman.'}</p>
      <div class="chips">${chips}</div>
      <div class="facts">${facts}</div>
      ${remote}
    </div>
    ${waiting ? `<button class="btn primary go" data-jump="ask" style="padding:8px 14px;font-size:13px">Jawab sekarang</button>` : ''}
  </section>`;
}

/* ports: K05 will not switch the firewall on while an open port is unanswered;
   the ports ride along in K05's blockers. */
function pendingPorts() {
  const k05 = ((DATA && DATA.controls) || []).find(k => k.id === 'K05');
  const raw = (k05 && (k05.blockers || [])[0]) || '';
  const out = [];
  // Shape written by yoructl: "port terbuka belum dijawab pemilik: 8888(python3) 3306(mariadbd)"
  for (const m of raw.matchAll(/(\d{1,5})\(([^)]*)\)/g)) out.push({port: m[1], proc: m[2]});
  return {ports: out, note: (k05 && k05.ai_note) || ''};
}

/* "Perlu jawabanmu": changed settings, open ports and approvals, one card each */
function askPanel() {
  const drift = DATA.drift || [];
  const {ports, note} = pendingPorts();
  const asking = DATA.pending_decisions || [];
  const total = waitingCount();
  if (!total) return '';
  const byId = {};
  (DATA.controls || []).forEach(k => byId[k.id] = k);
  const cards = [];

  // drift: the heart of the watch cycle
  for (const d of drift) {
    const bits = [];
    if (d.who)        bits.push(`diubah oleh <b>${esc(d.who)}</b>`);
    if (d.changed_at) bits.push(esc(when(d.changed_at)));
    if (d.command)    bits.push(`lewat <code>${esc(d.command)}</code>`);
    const evidence = bits.length ? bits.join(' · ')
      : 'Siapa yang mengubah nggak tercatat, karena jejak audit (auditd) belum aktif di server ini. Yoru nggak menebak.';
    cards.push(`<div class="ask warn" data-kid="${esc(d.id)}">
      <div class="badge warn">${I('alert')}</div>
      <div class="body">
        <div class="t">${esc(d.name)} berubah</div>
        <div class="d">Dulu <span class="was" title="${esc(d.changed_from)}">${esc(plain(d.id, d.changed_from))}</span>,
          sekarang <span class="now" title="${esc(d.changed_to)}">${esc(plain(d.id, d.changed_to))}</span>.
          Ini kamu yang ubah?</div>
        <div class="evidence">${evidence}</div>
        <span class="result" data-slot></span>
      </div>
      <div class="acts">
        <button class="btn" data-drift="sah">Iya, saya</button>
        <button class="btn danger" data-drift="kembalikan">Kembalikan</button>
      </div></div>`);
  }

  if (ports.length) {
    cards.push(`<div class="ask">
      <div class="badge info">${I('plug')}</div>
      <div class="body">
        <div class="t">Port ini terbuka ke internet. Punya kamu?</div>
        <div class="d">Firewall baru bisa dinyalakan setelah semua port ini kamu jawab.</div>
        ${note ? `<details class="why"><summary>Kata Yoru soal port ini</summary><p>${esc(note)}</p></details>` : ''}
        <div class="ports">${ports.map(p => `
          <div class="port" data-port="${esc(p.port)}">
            <span><span class="n">${esc(p.port)}</span>
              <span class="proc">${esc(p.proc || 'program tak dikenal')}</span></span>
            <button class="btn" data-portok="${esc(p.port)}">Punya saya</button>
          </div>`).join('')}</div>
        <span class="result" data-slot-port></span>
      </div></div>`);
  }

  for (const kid of asking) {
    const k = byId[kid] || {id: kid, name: kid};
    const rest = String(k.why || '').slice(firstSentence(k.why).length).trim();
    cards.push(`<div class="ask" data-kid="${esc(kid)}">
      <div class="badge fail">${I('shield')}</div>
      <div class="body">
        <div class="t">Boleh Yoru amankan: ${esc(k.name || kid)}?</div>
        <div class="d">${esc(firstSentence(k.why))}</div>
        ${rest || k.breaks_if_applied ? `<details class="why"><summary>Kenapa, dan apa yang ikut berubah?</summary>
          ${rest ? `<p>${esc(rest)}</p>` : ''}
          ${k.breaks_if_applied ? `<p><b>Yang ikut berubah:</b> ${esc(k.breaks_if_applied)}</p>` : ''}</details>` : ''}
        <span class="result" data-slot></span>
      </div>
      <div class="acts">
        <button class="btn primary" data-decide="setuju">Setujui</button>
        <button class="btn ghost" data-decide="tolak">Jangan</button>
      </div></div>`);
  }

  const remote = isLocal() ? '' : ' Jawabanmu dikerjakan di server itu pada pemeriksaan berikutnya.';
  return `<div class="panel" id="ask">
    <div class="head"><h2>Perlu jawabanmu</h2><span class="count">${total}</span>
      <span class="note">Yoru nunggu kamu sebelum lanjut.${remote}</span></div>
    <div class="asks">${cards.join('')}</div></div>`;
}

// One page answers one question: what has happened here. The score line and
// the action trail are two views of the same answer, so they share a page.
async function historyPage(gen) {
  $('meta').textContent = PICKED || (DATA && DATA.server && DATA.server.name) || '';
  $('content').innerHTML = skeleton(240, 320);

  const q = PICKED ? `?server=${encodeURIComponent(PICKED)}&limit=60` : '?limit=60';
  let rows = [];
  try {

  } catch (e) { /* drawn as empty below */ }
  if (gen !== RENDER) return;

  const logHtml = await logPanel(LOG_KID, gen);
  if (gen !== RENDER) return;

function chartPanel(rows) {
  if (!rows.length) {
    return `<div class="panel"><div class="empty">
      <b>Belum ada riwayat.</b>Riwayat terisi sendiri setiap kali Yoru mengecek server.</div></div>`;
  }

  const data = rows.slice().reverse();
  const W = 780, H = 170, pad = 26, n = data.length;
  const bw = Math.max(3, Math.min(34, (W - pad * 2) / n - 5));
  const step = (W - pad * 2) / n;
  const bars = data.map((r, i) => {
    const h = Math.max(2, (r.score / 100) * (H - pad - 12));
    const x = pad + i * step + (step - bw) / 2;
    return `<rect class="bar" x="${x.toFixed(1)}" y="${(H - pad - h).toFixed(1)}"
      width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${esc(when(r.time))} · skor ${r.score} (${esc(r.cycle)})</title></rect>`;
  }).join('');
  const gridlines = [0, 25, 50, 75, 100].map(v => {
    const y = H - pad - (v / 100) * (H - pad - 12);
    return `<line class="grid" x1="${pad}" y1="${y.toFixed(1)}" x2="${W - 6}" y2="${y.toFixed(1)}"/>
            <text class="lbl" x="2" y="${(y + 3).toFixed(1)}">${v}</text>`;
  }).join('');

  const first = data[0], last = data[n - 1];
  const delta = last.score - first.score;
  const arrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '=';
  const colour = delta > 0 ? 'var(--pass)' : delta < 0 ? 'var(--fail)' : 'var(--muted)';

  return `<div class="panel">
    <div class="head"><h2>Skor ${n} laporan terakhir</h2>
      <span class="note">arahkan kursor ke batang untuk melihat tanggalnya</span></div>
    <div class="panel-body">
      <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
           aria-label="Grafik skor keamanan dari waktu ke waktu">
        ${gridlines}${bars}
      </svg>
    </div>
    <div class="legend">
      <span>Paling lama: <b>${esc(when(first.time))}</b> · skor ${first.score}</span>
      <span>Terbaru: <b>${esc(when(last.time))}</b> · skor ${last.score}</span>
      <span style="color:${colour}">${arrow} ${delta > 0 ? '+' : ''}${delta} poin</span>
    </div></div>`;
}

  if (!(config.TELEGRAM_TOKEN || {}).set) return '';
  const chat = (config.TELEGRAM_CHAT_ID || {}).value || '';

  if (chat) return `<div class="note ok status">Tersambung ke chat <code>${esc(chat)}</code>.</div>`;
  if (code) return `<div class="note wait status">Belum tersambung. Buka bot kamu di Telegram, lalu kirim sekali:

}

        <div class="note" id="note_${sec.id}"></div>
      </div>
    </div>`).join('') +
    `<div class="footnote">Berkasnya: <code>${esc(config._berkas || '')}</code>
      (root:yoru-agent 640). Kunci dashboard dan kunci model sengaja tidak bisa diubah dari sini.</div>`;

  $('content').querySelectorAll('[data-save]').forEach(btn => {
    btn.onclick = () => saveSection(SETTINGS.find(s => s.id === btn.dataset.save), btn);
  });
}

function fieldHtml(f, cur) {
  const val = f.secret ? '' : (cur.value || '');
  const mark = f.secret && cur.set ? ' · sudah terisi, kosongkan kalau tidak mau diganti' : '';
  return `<div class="field">
    <label for="f_${f.key}">${esc(f.label)}<span class="mark">${esc(mark)}</span></label>
    <input id="f_${f.key}" ${f.secret ? 'type="password" autocomplete="off"' : 'type="text"'}
           value="${esc(val)}" placeholder="${f.secret && cur.set ? '••••••••••••' : ''}">
    <div class="hint">${esc(f.hint)}</div>
  </div>`;
}

async function saveSection(sec, btn) {
  const note = $('note_' + sec.id);
  btn.disabled = true; note.className = 'note busy'; note.textContent = 'menyimpan…';
  const failed = [];
  let saved = 0, said = '';
  for (const f of sec.fields) {
    const el = $('f_' + f.key);
    const val = el.value.trim();
    // Empty secret field means "do not change", not "clear it" - otherwise
    // opening this page and pressing Save would wipe a stored token.
    if (f.secret && val === '') continue;
    const r = await post('/api/config', {key: f.key, value: val});
    let d; try { d = await r.json(); } catch (e) { d = {}; }
    if (r.ok && d.ok === true) {
      saved++;
      if (f.secret) el.value = '';
      // Schedule keys change a systemd timer too, so report what yoructl did.
      if (d.message && !/^tersimpan di /.test(d.message)) said = d.message;
    } else failed.push(`${f.label}: ${d.message || d.detail || 'ditolak'}`);
  }
  btn.disabled = false;
  if (failed.length) { note.className = 'note bad'; note.textContent = failed.join(' · '); }
  else { note.className = 'note ok';
         note.textContent = `${saved} setelan tersimpan.${said ? ' ' + said + '.' : ''}`; }
}

/* actions */
function slotSay(slot, cls, text) {
  if (!slot) return;
  slot.className = 'result ' + cls;
  slot.textContent = text;
}

// Stored, not executed here: the agent on that server collects them, so these
// work for every server in the picker.
async function decide(control, value, slot, buttons) {
  const server = (DATA.server || {}).name;
  if (!server) return;
  buttons.forEach(b => b.disabled = true);
  slotSay(slot, 'busy', 'menyimpan…');
  try {
    const r = await post('/api/decision', {server, control, value});
    const d = await r.json();
    if (r.ok && d.ok) {
      slotSay(slot, 'ok', value === 'kembalikan'
        ? 'dicatat, dikembalikan pada pemeriksaan berikutnya'
        : value === 'sah'
        ? 'dicatat sebagai perubahan yang kamu sengaja'
        : value === 'setuju'
        ? (isLocal() ? 'disetujui, tinggal jalankan' : 'disetujui, dikerjakan di server itu')
        : 'dicatat, kontrol ini tidak akan diterapkan');
      toast(value === 'setuju' ? 'Disetujui' : value === 'tolak' ? 'Dicatat, nggak akan diterapkan'
            : value === 'sah' ? 'Dicatat sebagai perubahanmu' : 'Dicatat, akan dikembalikan');
      if (value === 'setuju' && isLocal()) offerApply(control, slot);
    } else {
      slotSay(slot, 'bad', d.detail || `gagal disimpan (HTTP ${r.status})`);
      buttons.forEach(b => b.disabled = false);
    }
  } catch (e) {
    slotSay(slot, 'bad', 'API tidak bisa dihubungi');
    buttons.forEach(b => b.disabled = false);
  }
}

// An approval that leads nowhere feels like nothing happened. On this machine
// the button that finishes the job appears right where the answer was given.
function offerApply(control, slot) {
  const box = slot.closest('[data-kid]');
  const acts = box && box.querySelector('.acts');
  if (!acts || acts.querySelector('[data-a="terapkan"]')) return;
  acts.innerHTML = '';
  const go = document.createElement('button');
  go.className = 'btn primary now';
  go.dataset.a = 'terapkan';
  go.textContent = 'Amankan sekarang';
  go.onclick = () => confirmApply(control, go);
  acts.appendChild(go);
}

async function vouchPort(port, btn, slot) {
  const server = (DATA.server || {}).name;
  if (!server) return;
  btn.disabled = true;
  slotSay(slot, 'busy', `menyimpan port ${port}…`);
  try {
    const r = await post('/api/port', {server, port: [Number(port)], note: 'dijawab lewat dashboard'});
    const d = await r.json();
    if (r.ok && d.ok) {
      btn.textContent = 'sudah dicatat';
      toast(`Port ${port} dicatat sebagai milikmu`);
      slotSay(slot, 'ok', `Port ${port} dicatat sebagai milikmu. Begitu semua port terjawab, `
        + `firewall boleh dinyalakan.`);
    } else {
      slotSay(slot, 'bad', d.detail || `gagal disimpan (HTTP ${r.status})`);
      btn.disabled = false;
    }
  } catch (e) {
    slotSay(slot, 'bad', 'API tidak bisa dihubungi');
    btn.disabled = false;
  }
}

// Short confirmation at the bottom of the screen.
let toastTimer = null;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 3200);
}

function wireButtons() {
  // one row per check opens its detail panel
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openControl(b.dataset.open));
  // "Jawab sekarang" in the hero
  document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () =>
    $(b.dataset.jump).scrollIntoView({behavior: 'smooth', block: 'start'}));
  // bulk: the same dialog as one check, ten lines filling in one by one.
  document.querySelectorAll('button[data-bulk]').forEach(b => {
    b.onclick = async () => {
      const action = b.dataset.bulk;
      if (action !== 'periksa' &&
          !confirm(`${ACTION_LABEL[action]} semua pemeriksaan?\n\nYang berisiko tetap nunggu persetujuanmu.`)) return;
      b.disabled = true;
      openBulk(action);
      const asking = new Set(DATA.pending_decisions || []);
      let done = 0, held = 0, broke = 0;
      for (const k of DATA.controls || []) {
        if (action === 'terapkan' && asking.has(k.id)) {
          bulkMark(k.id, 'hold', 'butuh persetujuanmu'); held++; continue;
        }
        if (action === 'terapkan' && (k.blockers || []).length) {
          bulkMark(k.id, 'hold', 'dilewati, prasyarat belum terpenuhi'); held++; continue;
        }
        bulkMark(k.id, 'on', 'berjalan…');
        const d = await run(k.id, action, null, true);
        const ok = d && d.ok === true;
        const waiting = d && (d.status === 'DITOLAK' || d.status === 'MENUNGGU');
        bulkMark(k.id, ok ? 'done' : waiting ? 'hold' : 'fail',
                 `${statusLabel((d || {}).status || 'ERROR')}${d && d.value ? ' · ' + plain(k.id, d.value) : ''}`);
        if (ok) done++; else if (waiting) held++; else broke++;
      }
      closeBulk(done, held, broke);
      b.disabled = false;
      load(true);
    };
  });
  // drift answers and approval queue
  document.querySelectorAll('[data-drift], [data-decide]').forEach(b => {
    b.onclick = () => {
      const box = b.closest('[data-kid]');
      const kid = box.dataset.kid;
      const value = b.dataset.drift || b.dataset.decide;
      decide(kid, value, box.querySelector('[data-slot]'),
             [...box.querySelectorAll('button')]);
    };
  });
  // port vouching
  document.querySelectorAll('[data-portok]').forEach(b => {
    b.onclick = () => vouchPort(b.dataset.portok, b,
                                document.querySelector('[data-slot-port]'));
  });
}

function confirmApply(kid, btn) {
  const k = (DATA.controls || []).find(x => x.id === kid) || {};
  $('confirmTitle').textContent = k.name || kid;
  $('confirmKid').textContent = `Sekarang: ${plain(kid, k.observed)} · Harusnya: ${plain(kid, k.target)}`;
  $('confirmWhy').textContent = k.why || '';
  $('confirmRisk').textContent = k.breaks_if_applied || '(katalog belum mencantumkan konsekuensinya)';
  const d = $('dlgConfirm');
  d.onclose = () => { if (d.returnValue === 'ya') run(kid, 'terapkan', btn); };
  d.showModal();
}

// The real sequence yoructl runs for each action, in plain words.
const STEPS = {
  periksa: ['Membaca setelan yang benar-benar berlaku sekarang',
            'Membandingkan dengan yang seharusnya'],
  terapkan: ['Menyimpan cadangan setelan lama',
             'Menulis setelan baru',
             'Memuat ulang layanannya',
             'Mengecek ulang hasilnya',
             'Kalau hasilnya tidak sesuai, langsung dikembalikan'],
  kembalikan: ['Menghapus setelan buatan Yoru',
               'Memuat ulang layanannya',
               'Mengecek ulang hasilnya']
};
const ACTION_LABEL = {periksa: 'Cek ulang', terapkan: 'Amankan', kembalikan: 'Kembalikan',
                      verifikasi: 'Cek hasil'};
// What yoructl answered, in the owner's words.
const RESULT_LABEL = {LULUS: 'Aman', GAGAL: 'Belum aman', SEBAGIAN: 'Setengah jalan',
                      DILEWATI: 'Dilewati', DIKEMBALIKAN: 'Dikembalikan', DISIMPAN: 'Tersimpan',
                      DITOLAK: 'Belum bisa', MENUNGGU: 'Masih jalan', ERROR: 'Error'};
const statusLabel = s => RESULT_LABEL[s] || s;

let runTimer = null;

function openBulk(action) {
  $('runTitle').textContent = `${ACTION_LABEL[action]} semua`;
  $('runKid').textContent = 'Satu per satu. Yang berisiko tetap nunggu persetujuanmu.';
  $('runCmd').textContent = '';
  $('runCmd').hidden = true;
  $('runReply').hidden = true;
  $('runLog').hidden = true;
  $('runClose').textContent = 'Batal tampilkan';
  $('runSteps').innerHTML = (DATA.controls || []).map(k =>
    `<li data-bulk="${esc(k.id)}">${esc(k.id)} · ${esc(k.name)} <span class="r"></span></li>`).join('');

  const started = Date.now();
  clearInterval(runTimer);
  $('runClock').textContent = 'berjalan… 0 detik';
  runTimer = setInterval(() => {
    $('runClock').textContent = `berjalan… ${Math.round((Date.now() - started) / 1000)} detik`;
  }, 1000);
  const d = $('dlgRun');
  d.onclose = null;
  if (!d.open) d.showModal();
}

function bulkMark(kid, cls, text) {
  const li = $('runSteps').querySelector(`[data-bulk="${CSS.escape(kid)}"]`);
  if (!li) return;
  li.className = cls;
  li.querySelector('.r').textContent = text ? '· ' + text : '';
  li.scrollIntoView({block: 'nearest'});
}

function closeBulk(done, held, broke) {
  clearInterval(runTimer);
  $('runClock').textContent = 'selesai';
  const box = $('runReply');
  box.className = 'reply ' + (broke ? 'bad' : held ? 'wait' : 'ok');
  box.textContent = `${done} beres` + (held ? `, ${held} nunggu atau dilewati` : '')
                                    + (broke ? `, ${broke} gagal` : '') + '.';
  box.hidden = false;
  $('runCmd').hidden = false;
  $('runClose').textContent = 'Tutup';
}

function openRun(kid, action) {
  const k = (DATA?.controls || []).find(x => x.id === kid) || {};
  $('runTitle').textContent = `${ACTION_LABEL[action] || action}: ${k.name || kid}`;
  $('runKid').textContent = k.name ? kid : '';
  $('runSteps').innerHTML = (STEPS[action] || []).map((s, i) =>
    `<li class="${i === 0 ? 'on' : ''}">${esc(s)}</li>`).join('');
  $('runCmd').textContent = `sudo yoructl ${kid} ${action}`;
  $('runCmd').hidden = false;
  $('runReply').hidden = true;
  $('runLog').hidden = true;
  $('runClose').textContent = 'Batal tampilkan';

  const started = Date.now();
  $('runClock').textContent = 'berjalan… 0 detik';
  clearInterval(runTimer);
  runTimer = setInterval(() => {
    $('runClock').textContent = `berjalan… ${Math.round((Date.now() - started) / 1000)} detik`;
  }, 1000);

  const d = $('dlgRun');
  if (!d.open) d.showModal();
}

function closeRun(kid, d) {
  clearInterval(runTimer);
  const box = $('runReply');
  const ok = d.ok === true;
  const waiting = d.status === 'DITOLAK' || d.status === 'MENUNGGU';
  box.className = 'reply ' + (ok ? 'ok' : waiting ? 'wait' : 'bad');
  box.innerHTML = `<b>${esc(statusLabel(d.status))}</b>${d.value ? ' · ' + esc(plain(kid, d.value)) : ''}` +
    (d.message ? `<br>${esc(d.message)}` : '');
  box.hidden = false;
  $('runClock').textContent = 'selesai';
  $('runSteps').querySelectorAll('li').forEach(li => li.classList.remove('on'));
  $('runClose').textContent = 'Tutup';
  $('runLog').hidden = false;
  $('dlgRun').onclose = () => {
    if ($('dlgRun').returnValue === 'log') {
      if ($('dlgCtl').open) $('dlgCtl').close();
      PAGE = 'history'; LOG_KID = kid; render();
    }
  };
}

// Works from the detail panel and from the approval cards alike: the scope is
// whatever element carries data-kid. The bulk run passes no button at all.
async function run(kid, action, btn, quiet) {
  const scope = btn ? (btn.closest('[data-kid]') || btn.parentElement) : null;
  const slot = scope && scope.querySelector('[data-slot]');
  if (scope) scope.querySelectorAll('button[data-a], button[data-decide], button[data-drift]')
    .forEach(b => b.disabled = true);
  slotSay(slot, 'busy', 'menjalankan…');
  if (!quiet) openRun(kid, action);
  let d;
  try {
    const r = await post('/api/run', {control: kid, action: action});
    d = await r.json();
    if (!r.ok) d = {status: 'DITOLAK', ok: false, message: d.detail || `HTTP ${r.status}`};
  } catch (e) { d = {status: 'ERROR', message: 'API tidak bisa dihubungi'}; }
  if (!quiet) closeRun(kid, d);

  // Three states, not two: "refused" is Yoru stopping on purpose, "error" is
  // something broken. Painting both red makes a healthy server look sick.
  const ok = d.ok === true;
  const waiting = d.status === 'DITOLAK' || d.status === 'MENUNGGU';
  slotSay(slot, ok ? 'ok' : waiting ? 'wait' : 'bad',
    `${statusLabel(d.status)}${d.value ? ' · ' + plain(kid, d.value) : ''}${d.message ? ' · ' + d.message : ''}`);
  if (scope && isLocal()) scope.querySelectorAll('button[data-a], button[data-decide], button[data-drift]')
    .forEach(b => { if (!(b.dataset.a === 'terapkan' && b.title)) b.disabled = false; });
  // After Cek ulang too, so a check that now passes moves the score.
  if (ok && !quiet) setTimeout(() => load(true), 600);
  return d;
}

/* boot */
$('nav').onclick = e => {
  const a = e.target.closest('a[data-h]'); if (!a) return;
  PAGE = a.dataset.h;
  if (PAGE === 'history') LOG_KID = null;   // the menu means "all controls"
  render();
};

// The daily check time, shown in the hero. Read quietly: a page opened from
// another machine without a token simply leaves it out, it never asks for one.
let SCHEDULE = '';
async function loadSchedule() {
  try {
    const r = await fetch('/api/config', {headers: TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {}});
    if (r.ok) SCHEDULE = (((await r.json()).JAM_PENJAGAAN || {}).value || '').trim();
  } catch (e) { /* no schedule line, nothing else changes */ }
}

$('content').innerHTML = skeleton(150, 220, 420);
(async () => { await loadServers(); await loadSchedule(); await load(true); })();

// The newest line of the action trail, in the hero, so the page shows what
// Yoru did last. One line, one request - a full log on a loop would be noise.
async function beat() {
  const el = $('lastAct'); if (!el) return;
  try {
    const r = await get('/api/log?limit=1');
    if (!r.ok) return;
    const b = ((await r.json()).lines || [])[0];
    if (!b) return;
    const k = ((DATA && DATA.controls) || []).find(x => x.id === b.id);
    el.innerHTML = `${I('activity')} Terakhir: ${esc(ACTION_LABEL[b.action] || b.action || '')}
      ${esc(k ? k.name : b.id || '')} · ${esc(statusLabel(b.status || ''))} ·
      <span data-ago="${esc(b.time)}">${ago(b.time)}</span>`;
  } catch (e) { /* decoration; a failure here must stay silent */ }
}

function watchLive() {
  clearInterval(liveTimer);
  if (PAGE !== 'dashboard') return;
  beat();
  liveTimer = setInterval(() => { beat(); tickTimes(); }, 15000);
}

// Only live-state pages auto-refresh; reloading a form would discard typing.
setInterval(() => {
  if (PAGE === 'dashboard') load();
}, 30000);
</script>
