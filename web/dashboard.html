<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoru — CIS Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%2334d399' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
<style>
:root{
  --sidebar:#0f172a; --sidebar-2:#1e293b; --sidebar-teks:#cbd5e1;
  --bg:#f1f5f9; --kartu:#ffffff; --garis:#e2e8f0;
  --teks:#0f172a; --samar:#64748b;
  --hijau:#16a34a; --hijau-bg:#dcfce7;
  --merah:#dc2626; --merah-bg:#fee2e2;
  --kuning:#ca8a04; --kuning-bg:#fef9c3;
  --biru:#0891b2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--teks);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif}
:focus-visible{outline:2px solid var(--biru);outline-offset:2px}

/* ---------- sidebar ---------- */
.wrap{display:flex;min-height:100vh}
.side{width:208px;flex:none;background:var(--sidebar);color:var(--sidebar-teks);
  display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;padding:18px 18px;
  border-bottom:1px solid var(--sidebar-2);color:#fff;font-weight:700;font-size:15px}
.brand svg{flex:none}
.side nav{padding:10px 0;flex:1}
.side nav a{display:flex;align-items:center;gap:10px;padding:10px 18px;
  color:var(--sidebar-teks);text-decoration:none;font-size:13.5px;cursor:pointer}
.side nav a:hover{background:var(--sidebar-2);color:#fff}
.side nav a.on{background:var(--sidebar-2);color:#fff;font-weight:600;
  box-shadow:inset 3px 0 0 #34d399}
.side .kaki{padding:14px 18px;border-top:1px solid var(--sidebar-2);
  font-size:11.5px;color:#64748b;line-height:1.5}

/* ---------- isi ---------- */
.main{flex:1;min-width:0;padding:20px 24px 48px}
.judul-hal{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.judul-hal h1{font-size:19px;margin:0}
.judul-hal .meta{font-size:12.5px;color:var(--samar);
  font-family:ui-monospace,Menlo,monospace}

/* ---------- kartu statistik ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px}
.stat{background:var(--kartu);border:1px solid var(--garis);border-radius:8px;
  padding:15px 17px;border-left:4px solid var(--garis)}
.stat.k{border-left-color:var(--kuning)} .stat.h{border-left-color:var(--hijau)}
.stat.m{border-left-color:var(--merah)}  .stat.b{border-left-color:var(--biru)}
.stat .atas{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stat .lbl{font-size:12.5px;color:var(--samar)}
.stat .val{font-size:28px;font-weight:700;line-height:1.15;margin-top:4px}
.stat.k .val{color:var(--kuning)} .stat.h .val{color:var(--hijau)}
.stat.m .val{color:var(--merah)}  .stat.b .val{color:var(--biru)}
.stat .sub{font-size:11.5px;color:var(--samar);margin-top:5px}
.stat .bar{height:6px;border-radius:99px;background:var(--garis);margin-top:9px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--kuning);transition:width .4s}

/* ---------- panel tabel ---------- */
.panel{background:var(--kartu);border:1px solid var(--garis);border-radius:8px;
  margin-top:18px;overflow:hidden}
.panel .kepala{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:13px 17px;border-bottom:1px solid var(--garis)}
.panel .kepala h2{font-size:14.5px;margin:0;flex:1}
.aksi-massal{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 12px/1 inherit;padding:7px 11px;border-radius:5px;cursor:pointer;
  border:1px solid var(--garis);background:var(--kartu);color:var(--samar);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.audit{border-color:#bae6fd;color:#0369a1}
.btn.hard{border-color:#fde68a;color:var(--kuning)}
.btn.roll{border-color:#fecaca;color:var(--merah)}
.btn.log{border-color:var(--garis);color:var(--samar)}

table{width:100%;border-collapse:collapse}
thead th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--samar);
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--garis);
  background:#f8fafc;white-space:nowrap;font-weight:600}
tbody td{padding:9px 12px;border-bottom:1px solid var(--garis);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafc}
td.no{color:var(--samar);font-family:ui-monospace,Menlo,monospace;font-size:12.5px;width:44px}
td.poin{font-weight:500;min-width:230px}
.cis{font:11.5px ui-monospace,Menlo,monospace;background:#f1f5f9;color:var(--samar);
  padding:2px 6px;border-radius:4px;white-space:nowrap}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.tag.p{background:var(--hijau-bg);color:var(--hijau)}
.tag.f{background:var(--merah-bg);color:var(--merah)}
.tag.n{background:var(--kuning-bg);color:var(--kuning)}
.tag.x{background:#f1f5f9;color:var(--samar)}
td.kapan{font:12px ui-monospace,Menlo,monospace;color:var(--samar);white-space:nowrap}
td.aksi{white-space:nowrap}
td.aksi .btn{margin-right:4px}
.hasil{display:block;font-size:11.5px;margin-top:5px}
.hasil.ok{color:var(--hijau)} .hasil.no{color:var(--merah)} .hasil.jln{color:var(--samar)}

/* ---------- dialog konfirmasi ---------- */
dialog{border:0;border-radius:10px;padding:0;max-width:540px;width:calc(100% - 32px);
  box-shadow:0 18px 50px rgba(15,23,42,.28)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg{padding:20px 22px}
.dlg h3{margin:0 0 4px;font-size:16px}
.dlg .kid{font:12px ui-monospace,Menlo,monospace;color:var(--samar)}
.dlg .risiko{border-left:4px solid var(--kuning);background:var(--kuning-bg);
  padding:11px 13px;border-radius:0 6px 6px 0;margin-top:14px}
.dlg .risiko b{display:block;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.03em;color:var(--kuning);margin-bottom:3px}
.dlg .risiko p{margin:0;font-size:13.5px}
.dlg .tombol{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.dlg .tombol button{font:600 13px/1 inherit;padding:9px 15px;border-radius:6px;cursor:pointer;
  border:1px solid var(--garis);background:var(--kartu)}
.dlg .tombol .ya{background:var(--kuning);border-color:var(--kuning);color:#fff}

/* ---------- log ---------- */
.logbox{font:12px/1.65 ui-monospace,Menlo,monospace;padding:14px 17px;
  max-height:60vh;overflow:auto}
.logbox div{border-bottom:1px solid var(--garis);padding:5px 0;display:flex;gap:10px;flex-wrap:wrap}
.logbox div:last-child{border-bottom:0}
.logbox .w{color:var(--samar);flex:none}
.logbox .s{font-weight:700;flex:none;width:104px}
.logbox .s.LULUS,.logbox .s.DIKEMBALIKAN{color:var(--hijau)}
.logbox .s.GAGAL,.logbox .s.DITOLAK,.logbox .s.ERROR{color:var(--merah)}
.logbox .s.DILEWATI,.logbox .s.PERINGATAN{color:var(--kuning)}
.kosong{padding:34px 18px;text-align:center;color:var(--samar)}
.kosong code{background:var(--bg);padding:2px 6px;border-radius:4px;
  font:12.5px ui-monospace,Menlo,monospace}
@media (max-width:820px){
  .side{width:60px}.side .brand span,.side nav a span,.side .kaki{display:none}
  .side nav a{justify-content:center;padding:12px 0}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2">
        <path d="M12 2 4 6v6c0 5 3.4 9 8 10 4.6-1 8-5 8-10V6l-8-4z"/></svg>
      <span>Yoru CIS Agent</span>
    </div>
    <nav id="nav">
      <a data-h="dashboard" class="on">▦ <span>Dashboard</span></a>
      <a data-h="checklist">☰ <span>CIS Checklist</span></a>
      <a data-h="log">◷ <span>Audit Logs</span></a>
      <a data-h="telegram">✈ <span>Telegram Bot</span></a>
      <a data-h="llm">✦ <span>LLM Settings</span></a>
      <a data-h="sistem">⚙ <span>System Settings</span></a>
    </nav>
    <div class="kaki">Semua tindakan lewat <b>yoructl</b>.<br>Agent tidak punya akses shell.</div>
  </aside>

  <main class="main">
    <div class="judul-hal">
      <h1 id="judul">Dashboard</h1>
      <span class="meta" id="meta"></span>
    </div>
    <div id="isi"></div>
  </main>
</div>

<dialog id="dlg"><form method="dialog" class="dlg">
  <h3 id="dlgJudul"></h3>
  <div class="kid" id="dlgKid"></div>
  <p id="dlgKenapa" style="color:var(--samar);font-size:13.5px;margin:10px 0 0"></p>
  <div class="risiko"><b>Kalau disetujui, ini yang ikut berubah</b><p id="dlgRisiko"></p></div>
  <div class="tombol">
    <button value="batal">Batal</button>
    <button value="ya" class="ya" id="dlgYa">Ya, jalankan</button>
  </div>
</form></dialog>

<script>
const $ = i => document.getElementById(i);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA = null, HAL = 'dashboard';

const pendek = t => {
  const s = String(t || '');
  if (s.startsWith('TIDAK_ADA')) return 'di luar CIS L1';
  return s.length > 22 ? s.slice(0, 21) + '…' : s;
};

const TAG = {LULUS:['PASSED','p'], GAGAL:['FAILED','f'], SEBAGIAN:['PARTIAL','n'],
             DILEWATI:['SKIPPED','x'], ERROR:['ERROR','x']};

async function muat() {
  try {
    const r = await fetch('/api/laporan');
    DATA = r.status === 404 ? null : await r.json();
  } catch (e) { DATA = null; }
  gambar();
}

function gambar() {
  $('judul').textContent = {dashboard:'Dashboard', checklist:'CIS Checklist',
    log:'Audit Logs', telegram:'Telegram Bot', llm:'LLM Settings',
    sistem:'System Settings'}[HAL];
  document.querySelectorAll('#nav a').forEach(a =>
    a.classList.toggle('on', a.dataset.h === HAL));

  if (HAL === 'log')      return halLog();
  if (HAL === 'telegram') return halInfo('Telegram Bot',
    'Notifikasi dikirim agent, bukan dari halaman ini. Isi TELEGRAM_TOKEN dan TELEGRAM_CHAT_ID di /etc/yoru/yoru.conf. Yoru cuma mengirim kalau ada yang berubah atau ada yang perlu dijawab.');
  if (HAL === 'llm')      return halInfo('LLM Settings',
    'Kunci model diisi di konfigurasi Hermes, bukan di sini — supaya cuma ada di satu tempat. Laporan tetap lengkap tanpa model: kalimat penjelasannya diambil dari katalog.');
  if (HAL === 'sistem')   return halInfo('System Settings',
    'Konfigurasi ada di /etc/yoru/yoru.conf (root:yoru-agent 640). Jadwal penjagaan diatur lewat systemd timer yoru-watch.timer.');

  if (!DATA) return kosong();
  $('meta').textContent = `${DATA.server?.nama || '-'} · ${DATA.server?.os || '-'} · ${(DATA.waktu||'').replace('T',' ').slice(0,16)}`;
  $('isi').innerHTML = (HAL === 'dashboard' ? kartuStat() : '') + tabel();
  pasangTombol();
}

function kosong() {
  $('meta').textContent = '';
  $('isi').innerHTML = `<div class="panel"><div class="kosong">
    <p><b>Belum ada laporan yang masuk.</b></p>
    <p>Jalankan agent di server yang mau dijaga:</p>
    <p><code>sudo yoru-agent --siklus perbaikan</code></p></div></div>`;
}

function halInfo(judul, teks) {
  $('meta').textContent = '';
  $('isi').innerHTML = `<div class="panel"><div class="kepala"><h2>${esc(judul)}</h2></div>
    <div style="padding:16px 17px;color:var(--samar);max-width:66ch">${esc(teks)}</div></div>`;
}

function kartuStat() {
  const r = DATA.ringkasan || {}, t = r.total || 10;
  const nunggu = (DATA.butuh_keputusan || []).length + (DATA.drift || []).length;
  return `<div class="stats">
    <div class="stat k"><div class="atas"><div><div class="lbl">Skor Kepatuhan CIS</div>
      <div class="val">${r.skor ?? 0}%</div></div><span style="font-size:19px">◔</span></div>
      <div class="bar"><i style="width:${r.skor ?? 0}%"></i></div></div>
    <div class="stat h"><div class="atas"><div><div class="lbl">Lolos Audit (Passed)</div>
      <div class="val">${r.lulus ?? 0} / ${t}</div></div><span style="font-size:19px">✓</span></div>
      <div class="sub">Sudah sesuai target</div></div>
    <div class="stat m"><div class="atas"><div><div class="lbl">Perlu Hardening (Failed)</div>
      <div class="val">${r.gagal ?? 0} / ${t}</div></div><span style="font-size:19px">⚠</span></div>
      <div class="sub">${nunggu ? nunggu + ' butuh persetujuan kamu' : 'Tidak ada yang menunggu'}</div></div>
    <div class="stat b"><div class="atas"><div><div class="lbl">Siklus</div>
      <div class="val" style="font-size:22px">${esc(DATA.siklus || '-')}</div></div>
      <span style="font-size:19px">◷</span></div>
      <div class="sub">Human-in-the-Loop aktif</div></div>
  </div>`;
}

function tabel() {
  const perlu = new Set(DATA.butuh_keputusan || []);
  const baris = (DATA.kontrol || []).map((k, i) => {
    const [teks, kelas] = TAG[k.status] || ['?', 'x'];
    const halangan = (k.prasyarat_gagal || []).length > 0;
    return `<tr data-kid="${esc(k.id)}">
      <td class="no">#${i + 1}</td>
      <td class="poin" title="${esc(k.kenapa)}">${esc(k.nama)}</td>
      <td><span class="cis" title="${esc(k.kode_cis || '')}">${esc(pendek(k.kode_cis || k.id))}</span></td>
      <td><span class="tag ${kelas}">${teks}</span></td>
      <td class="kapan">${esc((DATA.waktu || '').replace('T', ' ').slice(0, 16))}</td>
      <td class="aksi">
        <button class="btn audit" data-a="periksa">Audit</button>
        <button class="btn hard" data-a="terapkan" ${halangan ? 'disabled title="prasyarat belum terpenuhi"' : ''}
          data-izin="${perlu.has(k.id) ? 1 : 0}">Hardening</button>
        <button class="btn roll" data-a="kembalikan">Rollback</button>
        <span class="hasil" data-slot></span>
      </td>
      <td><button class="btn log" data-a="log">Log / AI</button></td>
    </tr>`;
  }).join('');

  return `<div class="panel">
    <div class="kepala">
      <h2>Daftar 10 Poin CIS Benchmark Ubuntu 24.04</h2>
      <div class="aksi-massal">
        <button class="btn audit" data-massal="periksa">Audit Semua</button>
        <button class="btn hard" data-massal="terapkan">Hardening Semua</button>
        <button class="btn roll" data-massal="kembalikan">Rollback Semua</button>
      </div>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>No</th><th>Poin CIS Hardening</th><th>Kode CIS</th><th>Status</th>
        <th>Terakhir Dijalankan</th><th>Aksi Eksekusi</th><th>Log &amp; AI</th></tr></thead>
      <tbody>${baris}</tbody>
    </table></div></div>`;
}

async function halLog(kid) {
  $('meta').textContent = kid ? kid : 'semua kontrol';
  const q = kid ? `?kontrol=${encodeURIComponent(kid)}` : '';
  let d;
  try { d = await (await fetch('/api/log' + q)).json(); } catch (e) { d = {baris: []}; }
  const isi = (d.baris || []).length
    ? d.baris.map(b => `<div><span class="w">${esc((b.waktu||'').replace('T',' ').slice(0,19))}</span>
        <span class="s ${esc(b.status)}">${esc(b.status)}</span>
        <span class="w">${esc(b.id)} ${esc(b.tindakan)}</span>
        <span>${esc(b.nilai ?? '')}${b.pesan ? ' — ' + esc(b.pesan) : ''}</span></div>`).join('')
    : `<div class="kosong">Belum ada catatan di /var/log/yoru/.
        ${esc(d.pesan || '')}</div>`;
  $('isi').innerHTML = `<div class="panel">
    <div class="kepala"><h2>Jejak tindakan${kid ? ' — ' + esc(kid) : ''}</h2>
    <div class="aksi-massal">${kid ? '<button class="btn log" id="semuaLog">Lihat semua</button>' : ''}</div></div>
    <div class="logbox">${isi}</div></div>`;
  const s = $('semuaLog'); if (s) s.onclick = () => halLog();
}

function pasangTombol() {
  document.querySelectorAll('tbody button[data-a]').forEach(b => {
    b.onclick = () => {
      const tr = b.closest('tr'), kid = tr.dataset.kid;
      if (b.dataset.a === 'log') { HAL = 'log'; gambar(); halLog(kid); return; }
      if (b.dataset.a === 'terapkan' && b.dataset.izin === '1') return tanya(kid, b);
      jalankan(kid, b.dataset.a, b);
    };
  });
  document.querySelectorAll('button[data-massal]').forEach(b => {
    b.onclick = async () => {
      const aksi = b.dataset.massal;
      if (aksi !== 'periksa' &&
          !confirm(`Jalankan ${aksi} untuk SEMUA kontrol?\n\nYang berisiko tetap ditanya satu per satu.`)) return;
      b.disabled = true;
      for (const tr of document.querySelectorAll('tbody tr')) {
        const t = tr.querySelector(`button[data-a="${aksi}"]`);
        if (!t || t.disabled) continue;
        if (aksi === 'terapkan' && t.dataset.izin === '1') {
          tr.querySelector('[data-slot]').className = 'hasil jln';
          tr.querySelector('[data-slot]').textContent = 'dilewati — butuh persetujuan';
          continue;
        }
        await jalankan(tr.dataset.kid, aksi, t);
      }
      b.disabled = false;
      muat();
    };
  });
}

function tanya(kid, tombol) {
  const k = (DATA.kontrol || []).find(x => x.id === kid) || {};
  $('dlgJudul').textContent = k.nama || kid;
  $('dlgKid').textContent = `${kid} · ${k.kode_cis || ''} · sekarang ${k.nilai_terbaca} → target ${k.nilai_target}`;
  $('dlgKenapa').textContent = k.kenapa || '';
  $('dlgRisiko').textContent = k.yang_rusak_kalau_diterapkan || '(katalog belum mencantumkan konsekuensinya)';
  const d = $('dlg');
  d.onclose = () => { if (d.returnValue === 'ya') jalankan(kid, 'terapkan', tombol); };
  d.showModal();
}

async function jalankan(kid, aksi, tombol) {
  const tr = tombol.closest('tr'), slot = tr.querySelector('[data-slot]');
  tr.querySelectorAll('button').forEach(b => b.disabled = true);
  slot.className = 'hasil jln'; slot.textContent = 'menjalankan…';
  let d;
  try {
    const r = await fetch('/api/jalankan', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({kontrol: kid, aksi})
    });
    d = await r.json();
  } catch (e) { d = {status: 'ERROR', pesan: 'API tidak bisa dihubungi'}; }

  const ok = d.berhasil === true;
  slot.className = 'hasil ' + (ok ? 'ok' : 'no');
  slot.textContent = `${d.status}${d.nilai ? ' — ' + d.nilai : ''}${d.pesan ? ' — ' + d.pesan : ''}`;
  tr.querySelectorAll('button').forEach(b => {
    if (!(b.dataset.a === 'terapkan' && b.title)) b.disabled = false;
  });
  if (ok && aksi !== 'periksa') setTimeout(muat, 900);
  return d;
}

$('nav').onclick = e => {
  const a = e.target.closest('a[data-h]'); if (!a) return;
  HAL = a.dataset.h; gambar(); if (HAL === 'log') halLog();
};

muat();
setInterval(() => { if (HAL === 'dashboard' || HAL === 'checklist') muat(); }, 30000);
</script>
</body>
</html>
