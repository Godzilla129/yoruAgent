<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoru — laporan server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%23191713'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='21' fill='%23faf8f4' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
<style>
/* Satu berkas, tanpa CDN dan tanpa unduhan huruf. Server yang dijaga Yoru
   belum tentu punya jalan keluar ke internet, dan halaman yang butuh unduhan
   dari luar akan tampil rusak justru di server yang paling perlu dijaga. */
:root{
  --kertas:#faf8f4; --panel:#f2eee6; --tempel:#fbf9f5f2;
  --tinta:#191713; --samar:#6d665b; --pudar:#968d7f;
  --garis:#dcd5c8; --rambut:#eae4d9;
  --aman:#2d6a41; --rawan:#a3382a; --tanya:#8a6512; --tanya-bg:#f8f1de;
  --fokus:#1a56c4;
}
@media (prefers-color-scheme:dark){
  :root{
    --kertas:#15140f; --panel:#1f1d16; --tempel:#15140ff2;
    --tinta:#ece6da; --samar:#9b9385; --pudar:#746d61;
    --garis:#343029; --rambut:#26231d;
    --aman:#84bb8d; --rawan:#e08c74; --tanya:#d9b264; --tanya-bg:#241f14;
    --fokus:#8aabf5;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--kertas);color:var(--tinta);
  font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif}
:focus-visible{outline:2px solid var(--fokus);outline-offset:2px;border-radius:2px}
.sheet{max-width:720px;margin:0 auto;padding:44px 24px 96px}

/* ---------- bar nempel ---------- */
/* Muncul setelah kartu skor lewat. Di daftar sepanjang ini, pemilik kehilangan
   dua hal begitu menggulir: dia lagi lihat server yang mana, dan berapa yang
   masih menunggu jawabannya. */
.bar{position:fixed;top:0;left:0;right:0;z-index:9;background:var(--tempel);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--garis);
  transform:translateY(-101%);transition:transform .18s ease}
.bar.on{transform:none}
.bar .in{max-width:720px;margin:0 auto;padding:9px 24px;display:flex;
  align-items:center;gap:12px;overflow:hidden;
  font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--samar)}
.bar .nm{font-weight:600;color:var(--tinta);flex:none}
.bar .os{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sc{margin-left:auto;flex:none;font-weight:600;color:var(--tinta)}
.bar .wait{color:var(--tanya)}

/* ---------- kepala ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  flex-wrap:wrap;border-bottom:2px solid var(--tinta);padding-bottom:9px}
.wordmark{font:400 32px/1 Georgia,"Times New Roman",serif;letter-spacing:-.015em}
.wordmark i{font-style:normal;color:var(--pudar)}
.head .when{font:12.5px/1.4 ui-monospace,Menlo,monospace;color:var(--samar);padding-bottom:3px}
.machine{display:flex;flex-wrap:wrap;margin-top:12px;
  font:12.5px/1.6 ui-monospace,Menlo,monospace;color:var(--samar)}
.machine span{padding-right:13px;margin-right:13px;border-right:1px solid var(--garis)}
.machine span:last-child{border-right:0;margin-right:0;padding-right:0}
.machine b{color:var(--tinta);font-weight:600}

/* ---------- skor ---------- */
.score{display:flex;align-items:flex-start;gap:22px;margin-top:30px}
.score .fig{font:400 76px/.82 Georgia,"Times New Roman",serif;letter-spacing:-.035em;
  font-variant-numeric:lining-nums tabular-nums}
.score .say{padding-top:5px}
.score .lead{font-size:17px;line-height:1.45}
.tally{display:flex;flex-wrap:wrap;margin-top:9px;
  font:12.5px/1.5 ui-monospace,Menlo,monospace;color:var(--samar)}
.tally span{padding-right:12px;margin-right:12px;border-right:1px solid var(--garis)}
.tally span:last-child{border-right:0}
.tally .ok b{color:var(--aman)} .tally .no b{color:var(--rawan)}

/* ---------- saringan ---------- */
.filter{display:flex;margin-top:26px;border-bottom:1px solid var(--garis);
  overflow-x:auto;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{font:600 13.5px/1 inherit;padding:11px 14px;border:0;background:none;
  color:var(--samar);cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.filter button:hover{color:var(--tinta)}
.filter button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--tinta)}
.filter .n{color:var(--pudar);margin-left:5px}
.filter button[aria-selected="true"] .n{color:var(--samar)}

/* ---------- bagian ---------- */
section{margin-top:34px}
section[hidden]{display:none}
section > h2{font:600 15.5px/1.35 inherit;margin:0}
section > .lede{color:var(--samar);font-size:14px;margin:3px 0 0;max-width:58ch}

/* Garis punggung: tiap baris menggantung di satu garis vertikal, penandanya
   duduk di atas garis itu. Mata bisa menyusuri satu jalur, bukan melompat
   antar kotak yang bentuknya sama semua. */
.ledger{margin-top:16px;border-left:1px solid var(--garis)}
.entry{position:relative;border-bottom:1px solid var(--rambut)}
.entry:last-child{border-bottom:0}
.entry[hidden]{display:none}
.entry::before{content:"";position:absolute;left:-4px;top:23px;z-index:1;
  width:7px;height:7px;background:var(--pudar);
  border:2px solid var(--kertas);border-radius:1px}
.entry.ok::before{background:var(--aman)}
.entry.bad::before{background:var(--rawan)}
.entry.act{background:var(--panel);border-bottom-color:var(--garis)}
.entry.act::before{background:var(--tanya);width:9px;height:9px;left:-5px;top:22px;
  border-color:var(--panel)}

/* Baris judul sekaligus tombol buka-tutup. Pakai <summary> supaya keyboard
   dan pembaca layar dapat perilakunya gratis, tanpa satu baris JS pun. */
.entry summary{list-style:none;cursor:pointer;padding:15px 16px 15px 26px;
  display:flex;gap:11px;align-items:baseline}
.entry summary::-webkit-details-marker{display:none}
.entry summary:hover .title{text-decoration:underline;text-underline-offset:3px}
.entry[open] summary{padding-bottom:2px}
.state{font:600 11px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.05em;
  text-transform:uppercase;flex:none;width:52px}
.state.ok{color:var(--aman)} .state.bad{color:var(--rawan)} .state.mid{color:var(--samar)}
.title{font-weight:600;font-size:16px;flex:1;min-width:0}
.code{font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--pudar);flex:none}
.chev{flex:none;color:var(--pudar);font-size:10px;transition:transform .15s ease}
.entry[open] .chev{transform:rotate(90deg)}

.detail{padding:0 16px 17px 26px}
.why{color:var(--samar);font-size:14.5px;margin:4px 0 0;max-width:62ch}

/* Nilai dua kolom, biar nilai panjang seperti daftar algoritma SSH tidak
   membungkus jadi bubur. */
.pair{display:grid;grid-template-columns:72px 1fr;gap:1px 10px;margin-top:10px;
  font:12.5px/1.55 ui-monospace,Menlo,monospace}
.pair dt{color:var(--pudar)}
.pair dd{margin:0;word-break:break-word}
.pair dd.was{color:var(--samar);text-decoration:line-through}

/* Kotak akibat. Aturan nomor 4 kontrak: WAJIB kelihatan tepat di sebelah
   tombol setuju - bukan di tooltip, bukan di halaman lain. Kotak ini dan
   tombolnya duduk di dalam satu blok yang sama, jadi mustahil melihat
   tombolnya tanpa ikut melihat akibatnya. */
.warn{border-left:3px solid var(--tanya);background:var(--tanya-bg);
  padding:10px 13px;margin-top:14px}
.warn .cap,.block .cap{display:block;font-size:11.5px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px}
.warn .cap{color:var(--tanya)}
.warn p,.block p{margin:0;font-size:14.5px;line-height:1.55}
.block{border-left:3px solid var(--rawan);padding:8px 0 8px 13px;margin-top:14px}
.block .cap{color:var(--rawan)}

.acts{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.acts button{font:600 14px/1 inherit;padding:10px 16px;border-radius:2px;cursor:pointer;
  border:1px solid var(--garis);background:var(--kertas);color:var(--tinta)}
.acts button:hover:not(:disabled){border-color:var(--samar)}
.acts button.go{background:var(--tinta);color:var(--kertas);border-color:var(--tinta)}
.acts button.go:hover:not(:disabled){opacity:.86}
.acts button:disabled{opacity:.4;cursor:default}
.said{font-size:13.5px;color:var(--aman);margin-top:12px}
.said.bad{color:var(--rawan)}

.none{padding:24px 0 24px 26px;color:var(--samar);font-size:14.5px}
.none[hidden]{display:none}
.empty{margin-top:32px;padding-top:26px;border-top:1px solid var(--garis)}
.empty p{margin:0 0 10px}
.empty code{font:13.5px ui-monospace,Menlo,monospace;border-bottom:1px solid var(--garis)}
.foot{margin-top:44px;padding-top:14px;border-top:1px solid var(--garis);
  font-size:12.5px;line-height:1.6;color:var(--pudar);max-width:60ch}
</style>
</head>
<body>
<div class="bar" id="bar"><div class="in">
  <span class="nm" id="barName"></span><span class="os" id="barOs"></span>
  <span class="sc" id="barScore"></span>
</div></div>

<div class="sheet">
  <div class="head">
    <div class="wordmark">Yoru<i>.</i></div>
    <div class="when" id="when"></div>
  </div>
  <div class="machine" id="machine"><span>memuat…</span></div>
  <div id="body"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const elBody = $('body'), elMachine = $('machine'), elWhen = $('when'), elFoot = $('foot');
let SERVER = null, SARING = 'semua';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Status di kontrak ditulis untuk mesin. Yang baca halaman ini pemilik warung
// online, bukan sysadmin - jadi katanya diganti yang dia pakai sehari-hari.
// Artinya tidak digeser sedikit pun.
const LABEL = {
  LULUS:['aman','ok'], GAGAL:['rawan','bad'], SEBAGIAN:['separuh','mid'],
  DILEWATI:['lewat','mid'], ERROR:['?','mid'],
};

async function load() {
  let d;
  try {
    const r = await fetch('/api/laporan');
    if (r.status === 404) return blank();
    d = await r.json();
  } catch (e) { return blank('Halaman ini nggak bisa nyambung ke API-nya sendiri.'); }
  SERVER = d.server?.nama || null;
  render(d);
}

function blank(msg) {
  elMachine.innerHTML = '<span>belum ada server yang lapor</span>';
  elWhen.textContent = ''; elFoot.textContent = '';
  elBody.innerHTML = `<div class="empty">
    <p>${esc(msg || 'Belum ada laporan yang masuk ke sini.')}</p>
    <p>Jalanin agent-nya di server yang mau dijaga:</p>
    <p><code>sudo yoru-agent --siklus perbaikan</code></p></div>`;
}

function render(d) {
  const r = d.ringkasan || {}, s = d.server || {};
  const drift = d.drift || [];
  const seen = new Set(drift.map(x => x.id));
  const need = new Set(d.butuh_keputusan || []);
  const ask  = (d.kontrol || []).filter(k => need.has(k.id) && !seen.has(k.id));
  const rest = (d.kontrol || []).filter(k => !need.has(k.id) && !seen.has(k.id));
  const nunggu = drift.length + ask.length;

  elWhen.textContent = (d.waktu || '').replace('T', ' ').slice(0, 16);
  elMachine.innerHTML =
    `<span><b>${esc(s.nama)}</b></span><span>${esc(s.os)}</span>` +
    `<span>${esc(s.ip_utama || 'ip tidak terbaca')}</span>` +
    (s.panel_terdeteksi ? `<span>${esc(s.panel_terdeteksi)}</span>` : '');

  $('barName').textContent = s.nama || '';
  $('barOs').textContent = s.os || '';
  $('barScore').innerHTML = nunggu
    ? `<span class="wait">${nunggu} nunggu</span> · ${r.skor ?? 0}/100`
    : `${r.skor ?? 0}/100`;

  // Angkanya harus menjumlah. "1 dari 10 aman, 7 rawan" bikin orang yang
  // teliti menghitung sisanya lalu bertanya-tanya dua yang lain ke mana.
  const tally = [`<span class="ok"><b>${r.lulus ?? 0}</b> aman</span>`];
  if (r.gagal)    tally.push(`<span class="no"><b>${r.gagal}</b> rawan</span>`);
  if (r.sebagian) tally.push(`<span><b>${r.sebagian}</b> separuh</span>`);
  if (r.dilewati) tally.push(`<span><b>${r.dilewati}</b> nggak kebaca</span>`);

  const nRawan = (d.kontrol || []).filter(k => k.status === 'GAGAL').length;
  const nAman  = (d.kontrol || []).filter(k => k.status === 'LULUS').length;

  let h = `
  <div class="score">
    <div class="fig">${r.skor ?? 0}</div>
    <div class="say">
      <div class="lead">${nunggu ? `Ada ${nunggu} hal yang nunggu kamu.`
                                 : 'Nggak ada yang perlu kamu kerjain sekarang.'}</div>
      <div class="tally">${tally.join('')}</div>
    </div>
  </div>

  <div class="filter" role="tablist">
    ${tab('semua', 'Semua', (d.kontrol || []).length)}
    ${nunggu ? tab('nunggu', 'Nunggu jawaban', nunggu) : ''}
    ${nRawan ? tab('rawan', 'Rawan', nRawan) : ''}
    ${nAman  ? tab('aman',  'Aman',  nAman)  : ''}
  </div>`;

  if (drift.length) h += part('drift', 'Ada yang berubah',
    'Setelan ini tadinya benar, sekarang nggak. Jawaban kamu di sini jadi patokan buat besok.',
    drift.map(rowDrift).join(''));

  if (ask.length) h += part('ask', 'Nunggu jawaban kamu',
    'Yoru nggak ngerjain yang ini tanpa izin — ada layanan lain yang bisa ikut kena.',
    ask.map(k => row(k, true)).join(''));

  if (rest.length) h += part('rest', 'Sisanya',
    'Diperiksa juga. Yang rawan di sini dibenerin Yoru sendiri, soalnya nggak ada yang ikut kena. Klik buat lihat rinciannya.',
    rest.map(k => row(k, false)).join(''));

  h += `<div class="none" id="none" hidden>Nggak ada yang cocok sama saringan itu.</div>`;

  elBody.innerHTML = h;
  elBody.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => send(b));
  elBody.querySelectorAll('.filter button').forEach(b => b.onclick = () => saring(b.dataset.f));
  saring(SARING);

  elFoot.textContent =
    `Siklus ${d.siklus}. Yoru ngecek ulang tiap hari dan nyatet semua tindakannya ke ` +
    `/var/log/yoru/ — catatan itu milik root, dan agent-nya sendiri nggak bisa ngedit. ` +
    `Halaman ini nggak pernah nyentuh server; dia cuma nampung jawaban kamu.`;
}

const tab = (k, teks, n) =>
  `<button role="tab" data-f="${k}" aria-selected="${k === SARING}">` +
  `${esc(teks)}<span class="n">${n}</span></button>`;

const part = (k, judul, lede, isi) =>
  `<section data-part="${k}"><h2>${esc(judul)}</h2><p class="lede">${esc(lede)}</p>` +
  `<div class="ledger">${isi}</div></section>`;

function row(k, act) {
  const [kata, warna] = LABEL[k.status] || ['?', 'mid'];
  const blocked = (k.prasyarat_gagal || []).length > 0;
  const kelas = act ? 'act' : (warna === 'ok' ? 'ok' : warna === 'bad' ? 'bad' : '');
  // Yang butuh jawaban dibuka dari awal, sisanya dilipat. Hampir separuh teks
  // di halaman ini soal hal yang sudah beres, dan itu menenggelamkan yang
  // benar-benar menunggu pemilik.
  return `
  <details class="entry ${kelas}" data-st="${esc(k.status)}" data-act="${act ? 1 : 0}" ${act ? 'open' : ''}>
    <summary>
      <span class="state ${warna}">${esc(kata)}</span>
      <span class="title">${esc(k.nama)}</span>
      <span class="code">${esc(k.id)}</span>
      <span class="chev">▶</span>
    </summary>
    <div class="detail">
      <p class="why">${esc(k.kenapa)}</p>
      <dl class="pair">
        <dt>sekarang</dt><dd>${esc(k.nilai_terbaca)}</dd>
        <dt>target</dt><dd>${esc(k.nilai_target)}</dd>
      </dl>
      ${blocked ? `<div class="block"><span class="cap">Belum bisa dijalanin</span>
        <p>${esc(k.prasyarat_gagal.join(' · '))}</p></div>` : ''}
      ${act && !blocked ? `
        <div class="warn"><span class="cap">Kalau kamu setuju, ini yang ikut berubah</span>
          <p>${esc(k.yang_rusak_kalau_diterapkan)}</p></div>
        <div class="acts">
          <button class="go" data-id="${esc(k.id)}" data-nilai="setuju">Ya, benerin</button>
          <button data-id="${esc(k.id)}" data-nilai="tolak">Nanti dulu</button>
        </div>` : ''}
      ${k.hasil ? `<div class="said${k.hasil.berhasil ? '' : ' bad'}">${k.hasil.berhasil
          ? 'Udah dibenerin dan dicek ulang — sekarang ' + esc(k.hasil.nilai_sesudah) + '.'
          : 'Gagal: ' + esc(k.hasil.pesan_error || 'nggak diketahui') + '.'}</div>` : ''}
    </div>
  </details>`;
}

function rowDrift(x) {
  const jejak = x.siapa
    ? `Diubah <b>${esc(x.siapa)}</b>${x.kapan_diubah ? ' ' + esc(x.kapan_diubah) : ''}` +
      `${x.perintah ? ' pakai <code>' + esc(x.perintah) + '</code>' : ''}.`
    : 'Nggak ada catatan siapa yang ngubah.';
  return `
  <details class="entry act" data-st="GAGAL" data-act="1" open>
    <summary>
      <span class="state bad">berubah</span>
      <span class="title">${esc(x.nama)}</span>
      <span class="code">${esc(x.id)}</span>
      <span class="chev">▶</span>
    </summary>
    <div class="detail">
      <dl class="pair">
        <dt>tadinya</dt><dd class="was">${esc(x.berubah_dari)}</dd>
        <dt>sekarang</dt><dd>${esc(x.berubah_jadi)}</dd>
      </dl>
      <p class="why">${jejak}</p>
      <div class="acts">
        <button data-id="${esc(x.id)}" data-nilai="sah">Itu emang saya</button>
        <button class="go" data-id="${esc(x.id)}" data-nilai="kembalikan">Balikin kayak semula</button>
      </div>
    </div>
  </details>`;
}

function saring(k) {
  SARING = k;
  document.querySelectorAll('.filter button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.f === k)));

  let tampil = 0;
  document.querySelectorAll('.entry').forEach(e => {
    const act = e.dataset.act === '1', st = e.dataset.st;
    const lolos = k === 'semua' || (k === 'nunggu' && act) ||
                  (k === 'rawan' && st === 'GAGAL') || (k === 'aman' && st === 'LULUS');
    e.hidden = !lolos;
    if (lolos) tampil++;
  });
  // Bagian yang seluruh isinya tersembunyi ikut disembunyikan, biar tidak ada
  // judul menggantung di atas daftar kosong.
  document.querySelectorAll('section[data-part]').forEach(sec => {
    sec.hidden = ![...sec.querySelectorAll('.entry')].some(e => !e.hidden);
  });
  const none = $('none');
  if (none) none.hidden = tampil > 0;
}

async function send(btn) {
  const baris = btn.closest('.entry');
  baris.querySelectorAll('button').forEach(b => b.disabled = true);
  const catat = document.createElement('div');
  try {
    const r = await fetch('/api/keputusan', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({server: SERVER, kontrol: btn.dataset.id, nilai: btn.dataset.nilai})
    });
    if (!r.ok) throw new Error(await r.text());
    catat.className = 'said';
    catat.textContent = 'Kecatat. Yoru ngerjainnya pas pemeriksaan berikutnya.';
  } catch (e) {
    baris.querySelectorAll('button').forEach(b => b.disabled = false);
    catat.className = 'said bad';
    catat.textContent = 'Gagal nyimpen jawaban kamu. Coba lagi.';
  }
  baris.querySelector('.detail').appendChild(catat);
}

// Bar nempel muncul begitu kartu skor lewat.
addEventListener('scroll', () => $('bar').classList.toggle('on', scrollY > 190),
                 {passive: true});

load();
setInterval(load, 30000);
</script>
</body>
</html>
