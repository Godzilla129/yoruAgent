<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoru · Penjaga server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M16 6l7 3v5.5c0 4.2-2.8 7.6-7 8.9-4.2-1.3-7-4.7-7-8.9V9z' fill='none' stroke='%2334d399' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>

<header class="masthead">
  <div class="bar">
    <div class="brand">Yoru<small>penjaga server</small></div>
    <nav id="nav" aria-label="Menu">
      <button type="button" data-h="dashboard" class="on" aria-current="page">Beranda</button>
      <button type="button" data-h="history">Riwayat</button>
      <button type="button" data-h="settings">Setelan</button>
    </nav>
    <div class="bar-end">
      <span class="conn" id="conn" role="status">menyambung…</span>
      <div class="theme" id="theme" role="group" aria-label="Tema tampilan">
        <button type="button" data-t="sistem" aria-label="Tema ikut sistem" title="Ikut sistem"></button>
        <button type="button" data-t="terang" aria-label="Tema terang" title="Terang"></button>
        <button type="button" data-t="gelap" aria-label="Tema gelap" title="Gelap"></button>
      </div>
    </div>
  </div>
</header>

<main class="page">
  <div class="picker" id="serverPicker" hidden>
    <label for="serverSelect">Server</label>
    <select id="serverSelect"></select>
    <span class="badge x" id="localTag" hidden>mesin ini</span>
  </div>
  <div class="page-head" id="pageHead">
    <h1 id="pageTitle">Beranda</h1>
    <p id="meta"></p>
  </div>
  <div id="content"></div>
</main>

<dialog id="dlgCtl" class="drawer"><form method="dialog" class="dr" id="ctlBody"></form></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlgConfirm"><form method="dialog" class="dlg">
  <h3 id="confirmTitle"></h3>
  <div class="kid" id="confirmKid"></div>
  <p id="confirmWhy"></p>
  <div class="risk"><b>Kalau disetujui, ini yang ikut berubah</b><p id="confirmRisk"></p></div>
  <div class="buttons">
    <button class="btn" value="batal">Batal</button>
    <button class="btn primary" value="ya" id="confirmGo">Ya, amankan</button>
  </div>
</form></dialog>

<dialog id="dlgRun"><form method="dialog" class="dlg">
  <h3 id="runTitle"></h3>
  <div class="kid" id="runKid"></div>
  <ul class="steps" id="runSteps"></ul>
  <div class="cmd" id="runCmd"></div>
  <div class="clock" id="runClock"></div>
  <div class="reply" id="runReply" hidden></div>
  <div class="buttons">
    <button class="btn" value="log" id="runLog" hidden>Lihat log</button>
    <button class="btn primary" value="tutup" id="runClose">Tutup</button>
  </div>
</form></dialog>

<dialog id="dlgToken"><form method="dialog" class="dlg">
  <h3>Server ini minta token</h3>
  <p>Dashboard ini dibuka dari komputer lain, jadi perlu token dulu. Tokennya ada di
     server itu, di <code>/etc/yoru/yoru.conf</code> baris <b>DASHBOARD_TOKEN</b>.</p>
  <input id="tokenInput" type="password" autocomplete="off" placeholder="tempel token di sini">
  <div class="buttons">
    <button class="btn" value="batal">Batal</button>
    <button class="btn primary" value="ya">Simpan</button>
  </div>
</form></dialog>

<script src="/dashboard.js"></script>
</body>
</html>
