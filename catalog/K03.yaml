id: K03
nama: "Batasi percobaan login SSH"
kode_cis: "5.1.16 dan 5.1.13"
kode_cis_judul_asli:
  - "5.1.16 Ensure sshd MaxAuthTries is configured"
  - "5.1.13 Ensure sshd LoginGraceTime is configured"
kode_cis_sumber: "Tenable audit CIS_Ubuntu_Linux_24.04_LTS_v1.0.0_L1_Server.audit rev 1.14 (17 Jul 2026), dicocokkan 5 Sep 2026. Bukan dari PDF CIS asli."
kode_cis_koreksi: >
  Sebelum dicocokkan, berkas ini menulis "5.2.x" - penanda bahwa nomornya
  memang belum diketahui. Sekarang sudah, dan ternyata dua nomor, bukan satu.
  Satu kontrol Yoru menutup dua rekomendasi CIS sekaligus karena keduanya
  ditulis ke berkas drop-in yang sama.
risiko: AMAN
kategori: ssh

kenapa: >
  Default Ubuntu ngasih 6 kali percobaan password per koneksi
  dan 120 detik waktu tunggu. Dipersempit jadi 3 kali dan 30 detik
  bikin serangan brute force jauh lebih lambat dan lebih gampang
  ketahuan di log.

periksa:
  perintah: "sshd -T | grep -E 'maxauthtries|logingracetime'"
  lolos_jika: "maxauthtries 3 DAN logingracetime 30"
  nilai_default_ubuntu: "maxauthtries 6, logingracetime 120"

status_awal_server_ini: GAGAL

terapkan:
  metode: drop-in
  file: "/etc/ssh/sshd_config.d/01-yoru-k03.conf"
  isi: |
    MaxAuthTries 3
    LoginGraceTime 30
  validasi_sebelum_reload: "sshd -t"
  reload: "systemctl reload ssh"

kembalikan:
  perintah: "rm -f /etc/ssh/sshd_config.d/01-yoru-k03.conf"
  validasi_sebelum_reload: "sshd -t"
  reload: "systemctl reload ssh"

verifikasi:
  perintah: "sshd -T | grep -E 'maxauthtries|logingracetime'"
  cek_layanan: "systemctl is-active ssh"
  cek_layanan_harus: "active"

yang_rusak_kalau_diterapkan: >
  Tidak ada. Kontrol ini aman untuk hampir semua server.
  Efek satu-satunya: user yang sering salah ketik password
  harus reconnect lebih cepat.

catatan_panel:
  aapanel: "aman"
  cpanel: "aman"

diuji_pada: "Ubuntu 24.04, VM yoru-a, 3 Sep 2026; jalur dispatcher diuji 5 Sep 2026"
rollback_teruji: true
rollback_teruji_lewat_dispatcher: true
bukti_uji_dispatcher: >
  5 Sep 2026, VM yoru-a, yoructl 0.1.1:
  kembalikan -> DIKEMBALIKAN "6/120" (bawaan OpenSSH, tidak ada yang menimpa);
  verifikasi -> GAGAL "6/120";
  terapkan   -> LULUS "3/30";
  verifikasi -> LULUS "3/30".
  Nilainya ditulis "maxauthtries/logingracetime".
