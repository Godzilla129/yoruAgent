id: K07
nama: "Pembaruan keamanan otomatis"
kode_cis: "1.9"
risiko: AMAN
kategori: pembaruan

kenapa: >
  Mayoritas server dibobol lewat celah yang tambalannya sudah
  tersedia berbulan-bulan, cuma tidak pernah dipasang.
  Kontrol ini bikin tambalan keamanan terpasang sendiri.

periksa:
  perintah_paket:   "dpkg -s unattended-upgrades | grep Status"
  perintah_service: "systemctl is-enabled unattended-upgrades"
  perintah_config:  "cat /etc/apt/apt.conf.d/20auto-upgrades"
  lolos_jika: >
    paket terinstall DAN service enabled DAN kedua nilai
    APT::Periodic bernilai "1"

status_awal_server_ini: LOLOS
catatan_default_ubuntu: >
  Ubuntu Server 24.04 mengirim kontrol ini dalam keadaan aktif.
  Kalau di sebuah server nilainya "0", berarti ada yang sengaja
  mematikannya. Itu sinyal yang perlu ditanyakan ke pemilik,
  bukan sekadar diperbaiki diam-diam.

terapkan:
  paket: "apt install -y unattended-upgrades"
  config: |
    APT::Periodic::Update-Package-Lists "1";
    APT::Periodic::Unattended-Upgrade "1";
  file_config: "/etc/apt/apt.conf.d/20auto-upgrades"
  service: "systemctl enable --now unattended-upgrades"
  catatan: >
    Jangan pakai dpkg-reconfigure. Perintah itu interaktif dan
    butuh manusia mencet tombol. Semua perintah katalog harus
    bisa jalan tanpa manusia.

kembalikan:
  config: |
    APT::Periodic::Update-Package-Lists "0";
    APT::Periodic::Unattended-Upgrade "0";
  file_config: "/etc/apt/apt.conf.d/20auto-upgrades"
  service: "systemctl disable --now unattended-upgrades"
  catatan: >
    Rollback di sini BUKAN menghapus file, tapi mengembalikan
    nilainya ke "0". Menghapus file akan menghasilkan kondisi
    ketiga yang tidak direncanakan.

verifikasi:
  perintah: "systemctl is-enabled unattended-upgrades"
  bukti_berfungsi: "unattended-upgrade --dry-run --debug"
  catatan: >
    Config yang benar bukan jaminan fiturnya jalan. Dry-run
    membuktikan fiturnya benar-benar berfungsi.

yang_rusak_kalau_diterapkan: >
  Nyaris tidak ada di server biasa. Tapi di server dengan aplikasi
  yang sensitif terhadap versi paket, update otomatis bisa memicu
  restart service di waktu yang tidak diinginkan.

catatan_panel:
  aapanel: "aman"
  cpanel: "BENTROK - cPanel mengelola pembaruan paketnya sendiri. Lewati."

bug_yang_ditemukan_saat_uji_dispatcher:
  ditemukan: "5 Sep 2026, VM yoru-a, yoructl 0.1.1"
  tingkat: WAJIB_DIPERBAIKI_SEBELUM_DEPLOY
  gejala: >
    terapkan mengembalikan DITOLAK dengan pesan "gagal memasang paket -
    periksa koneksi internet server". Padahal internet server hidup: git
    pull baru saja berhasil, dan perintah apt yang sama persis dijalankan
    manual satu menit kemudian langsung sukses ("unattended-upgrades is
    already the newest version"). Diulang lewat dispatcher tanpa mengubah
    apa pun, hasilnya LULUS. Jadi kegagalannya sesaat, bukan menetap.
  dugaan_penyebab: >
    Kunci dpkg masih terpegang sebentar. Persis sebelum terapkan, kembalikan
    menjalankan 'systemctl disable --now unattended-upgrades' - dan layanan
    itu memang layanan yang memegang kunci apt. Timer apt-daily bawaan
    Ubuntu juga bisa jadi penyebab. BELUM DIBUKTIKAN sampai ke akarnya;
    ditulis sebagai dugaan, bukan kesimpulan.
  kenapa_ini_gawat_di_produksi: >
    Di VPS yang baru dinyalakan, apt-daily dan unattended-upgrades justru
    berjalan pada menit-menit pertama setelah boot - dan itu tepat saat
    Yoru menjalankan siklus perbaikan pertamanya. Jadi kondisi yang bikin
    gagal ini BUKAN kasus langka, malah kemungkinan besar terjadi.
  dua_masalah_terpisah:
    - id: pesan_error_menuduh_tanpa_bukti
      masalah: >
        Perintah aptnya ditulis 'apt-get install ... >/dev/null 2>&1', jadi
        seluruh keluhan apt dibuang, lalu kita mengarang penyebabnya sendiri
        di teks pesan. Pemilik server dikirimi diagnosis yang tidak pernah
        diperiksa siapa pun. Ini penyakit yang sama yang kita larang untuk
        agent - hasil kosong dipakai sebagai kesimpulan - tapi kali ini ada
        di kode kita sendiri.
      perbaikan: >
        Tangkap keluaran apt ke variabel, jangan dibuang. Teruskan baris
        terakhirnya apa adanya ke field pesan. Kalau tidak tahu penyebabnya,
        katakan tidak tahu dan lampirkan keluaran aslinya.
      berlaku_juga_di: "K08 - pemasangan auditd memakai pola yang sama"
    - id: tidak_tahan_kunci_apt_sesaat
      masalah: >
        Sekali gagal langsung menyerah, padahal kunci apt itu memang wajar
        terpegang beberapa detik.
      perbaikan: >
        (1) Lewati apt sama sekali kalau paketnya sudah terpasang - periksa
        dengan dpkg-query lebih dulu. (2) Kalau memang harus memasang, pakai
        -o DPkg::Lock::Timeout=60 supaya apt menunggu kuncinya, bukan
        langsung gagal.

diuji_pada: "Ubuntu 24.04, VM yoru-a, 3 Sep 2026; jalur dispatcher diuji 5 Sep 2026"
rollback_teruji: true
rollback_teruji_lewat_dispatcher: true
bukti_uji_dispatcher: >
  5 Sep 2026, VM yoru-a, yoructl 0.1.1:
  kembalikan -> DIKEMBALIKAN "disabled";
  verifikasi -> GAGAL "disabled";
  terapkan   -> DITOLAK berhasil:false (lihat bug di atas);
  terapkan (diulang) -> LULUS "enabled".
  Jalur kembalikan bersih. Jalur terapkan berfungsi tapi rapuh.
