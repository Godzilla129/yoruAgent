id: K05
nama: "Firewall aktif, tolak semua koneksi masuk"
kode_cis: "4.2.1, 4.2.3 dan 4.2.7"
kode_cis_judul_asli:
  - "4.2.1 Ensure ufw is installed"
  - "4.2.3 Ensure ufw service is enabled"
  - "4.2.7 Ensure ufw default deny firewall policy"
kode_cis_sumber: "Tenable audit CIS_Ubuntu_Linux_24.04_LTS_v1.0.0_L1_Server.audit rev 1.14 (17 Jul 2026), dicocokkan 5 Sep 2026. Bukan dari PDF CIS asli."
kode_cis_koreksi: >
  Sebelum dicocokkan, berkas ini menulis "3.5.1". Itu penomoran benchmark
  Ubuntu versi lama - di 24.04, bagian 3.5 sudah bukan firewall. Sudah
  dibetulkan.
kode_cis_yang_belum_kami_kerjakan:
  daftar:
    - "4.1.1 Ensure a single firewall configuration utility is in use - Yoru belum memeriksa apakah nftables atau iptables juga aktif berbarengan dengan ufw"
    - "4.2.4 Ensure ufw loopback traffic is configured"
    - "4.2.5 Ensure ufw outbound connections are configured"
    - "4.2.6 Ensure ufw firewall rules exist for all open ports - sebagian tertutup K06"
  catatan: >
    Ditulis di sini supaya tidak ada yang mengira K05 menutup seluruh bagian
    firewall CIS. Empat item di atas belum dikerjakan.
risiko: BERISIKO
kategori: firewall

kenapa: >
  Tanpa firewall, semua port yang kebuka bisa diakses siapa saja
  dari internet. Termasuk port yang kebuka gak sengaja karena
  aplikasi salah konfigurasi. Ini kontrol dengan dampak terbesar
  dari sepuluh.

prasyarat:
  - id: ssh_diizinkan_dulu
    cek: "port dari 'sshd -T' harus sudah masuk 'ufw show added' sebelum enable"
    wajib: true
    kalau_gagal: BATALKAN
    alasan: >
      ufw enable langsung menerapkan tolak-semua saat itu juga.
      Kalau izin SSH belum terdaftar, koneksi pemilik server
      putus detik itu dan tidak bisa tersambung lagi.
  - id: port_layanan_terdata
    cek: "ss -tulpn | grep LISTEN"
    wajib: true
    kalau_gagal: TANYA_PEMILIK
    alasan: >
      Port layanan lain (web, panel, database) harus diizinkan
      dulu, atau layanannya ikut mati.

periksa:
  perintah: "ufw status verbose"
  lolos_jika: "Status: active DAN Default: deny (incoming)"
  kondisi_awal_umum: "Status: inactive di Ubuntu bawaan"

status_awal_server_ini: GAGAL

terapkan:
  urutan_wajib: true
  langkah:
    - "ufw allow <port-dari-sshd-T>/tcp comment 'SSH - yoru K05'   (lihat port_ssh_tidak_dipatok)"
    - "ufw default deny incoming"
    - "ufw default allow outgoing"
    - "ufw --force enable"
  catatan: >
    Pakai --force karena tanpa itu ufw menampilkan konfirmasi
    interaktif dan menunggu input manusia.

kembalikan:
  perintah: "ufw --force reset"
  catatan: >
    reset otomatis mem-backup semua file aturan ke nama bertanggal
    sebelum menghapus. Hasil akhirnya Status: inactive, sama
    seperti kondisi awal Ubuntu.

verifikasi:
  perintah: "ufw status verbose"
  cek_layanan: "systemctl is-active ssh"
  cek_layanan_harus: "active"
  bukti_berfungsi: >
    Buka koneksi SSH BARU dari mesin lain. Kalau berhasil,
    firewall aktif tanpa memutus akses. Sesi lama jangan ditutup
    sebelum sesi baru terbukti bisa masuk.

yang_rusak_kalau_diterapkan: >
  Semua layanan yang portnya tidak diizinkan akan tidak bisa
  diakses dari luar. Web (80/443), panel, database remote,
  semuanya harus didaftarkan dulu.

catatan_panel:
  status: "SUDAH DITANGANI KODE sejak yoructl 0.1.5 - lihat port_layanan_dinamis"
  aapanel: "port panel (bawaannya 8888) ikut terbaca sebagai port terbuka, dan K05 menolak menyala sampai pemilik menjawabnya"
  cyberpanel: "sama, bawaannya 8090"
  cpanel: >
    Tetap TIDAK dinyalakan, tapi sekarang otomatis: cPanel memakai CSF, dan
    terapkan berhenti sendiri begitu CSF terdeteksi. Dua firewall akan saling
    menimpa aturan.

port_layanan_dinamis:
  sejak: "yoructl 0.1.5"
  diminta_oleh: "julmukcur, 8 Sep 2026 - 'gw mau si yoru itu dinamis, gw ga mau bentrok'"
  godaan_yang_dihindari: >
    Cara termudah adalah menghafalkan nomornya: 8888 aaPanel, 8090
    CyberPanel, 2083 cPanel. Itu kesalahan yang sama persis dengan mematok
    port SSH di 22, cuma dibungkus lebih rapi. Orang bisa mengganti port
    panelnya, web bisa di 8080 atau 3000, dan panel yang belum kami tahu ada
    ratusan. Daftar hafalan selalu ketinggalan, dan begitu ketinggalan
    akibatnya pemilik terkunci dari panelnya sendiri.
  caranya: >
    Sama seperti SSH: baca kenyataan. "ss -tlnp" memberi tahu port TCP mana
    yang benar-benar terbuka ke luar berikut nama prosesnya. Alamat loopback
    dibuang karena tidak bisa dihubungi dari internet.
  lalu_diapakan: >
    Yoru TIDAK tahu 8888 itu panel atau lubang - yang tahu cuma pemiliknya.
    Jadi terapkan berhenti dan menyebutkan portnya, bukan menebak.
    Mengizinkan otomatis membuat firewallnya tidak ada gunanya, karena port
    yang terbuka TIDAK SENGAJA - justru yang mau ditutup - ikut diizinkan.
    Membiarkannya tertutup mengunci pemilik dari panelnya. Satu-satunya
    jawaban benar adalah bertanya.
  alur_lengkap: >
    periksa melaporkan port yang belum dijawab di field "pesan" ->
    Hermes bertanya ke pemilik ("port 8888 terbuka dipakai python3, itu panel
    kamu?") -> jawaban dicatat -> terapkan baru mau jalan.
    Inilah bagian yang tidak bisa dikerjakan skrip biasa.
  dari_mana_daftar_izinnya:
    - "/etc/yoru/yoru.conf  PORT_DIIZINKAN=\"80 443 8888\"  - milik root, agent tidak bisa menulis"
    - "/var/lib/yoru/port-disetujui  - ditulis agent dari jawaban pemilik, satu port per baris"
  kenapa_agent_boleh_menulis_yang_kedua: >
    Kalau pemilik harus SSH masuk lalu menyunting berkas sendiri, janji
    "buat yang tidak punya tim IT" bubar. Ini juga bukan pelebaran kekuasaan:
    agent sudah bisa memanggil "K05 kembalikan" yang mematikan firewall
    sepenuhnya, jadi menambah satu port izin lebih kecil dari yang sudah bisa
    dia lakukan. Setiap port yang diizinkan tetap tercatat di jejak audit
    milik root, yang tidak bisa disunting agent. Yang mau lebih ketat tinggal
    memakai yoru.conf saja.
  isi_berkas_divalidasi: >
    Cuma angka 1-65535 yang diterima. Baris seperti "abc", "99999", "-1",
    "0", atau "443; rm -rf /" dibuang tanpa dijalankan.
  bentrok_firewall_lain:
    diperiksa: "CSF (lewat perintah csf atau /etc/csf/csf.conf) dan firewalld (systemctl is-active)"
    kalau_ketemu: "terapkan DITOLAK, ufw tidak disentuh sama sekali"
    kenapa: >
      Dua firewall di satu server bukan konfigurasi - itu lomba lari, dan
      pemenangnya berubah tergantung urutan start layanan. Pelajaran yang
      sama dengan K10 dan ufw soal log_martians, cuma skalanya seluruh tabel
      aturan. Ini sebagian dari CIS 4.1.1.
    yang_belum: >
      nftables belum diperiksa, karena ufw sendiri memakainya sebagai mesin
      di belakang layar dan kami belum menguji cara membedakan "nftables
      punya ufw" dengan "nftables punya pemilik". Ditulis supaya tidak
      dikira sudah lengkap.
  yang_belum_ditangani: >
    UDP tidak ikut didata. Yang membuat orang terkunci di luar itu TCP - ssh,
    web, panel. Memasukkan UDP hanya menambah keramaian seperti port klien
    DHCP. Ini lubang yang kami tahu.
  diuji: >
    8 Sep 2026, sembilan keadaan dengan ss, ufw, sshd dan systemctl tiruan.
    Server contoh: sshd 4422, nginx 80 dan 443, panel 8888, mariadb hanya di
    127.0.0.1, memcached hanya di [::1].
    (1) periksa menyebut "80(nginx) 443(nginx) 8888(python3)" - mariadb dan
    memcached tidak ikut, port SSH tidak ikut;
    (2) terapkan DITOLAK dan ufw tetap inactive;
    (3) setelah tiga port dijawab, pesan periksa jadi null;
    (4) terapkan LULUS, aturan terpasang 4422 bertanda "SSH - yoru K05" dan
    80/443/8888 bertanda "disetujui pemilik - yoru K05";
    (5) verifikasi LULUS;
    (6) port baru 3000 muncul belakangan - langsung terbaca sebagai belum
    dijawab, padahal status K05 masih LULUS;
    (7) firewalld aktif -> DITOLAK;
    (8) CSF terpasang -> DITOLAK;
    (9) berkas port berisi sampah dan percobaan suntikan perintah -> semuanya
    dibuang, tidak ada yang dijalankan.
  diuji_di_mesin_sungguhan: >
    8 Sep 2026, VM yoru-a, Ubuntu 24.04, yoructl 0.1.5. Bukan tiruan.
    "ss -tlnp" mengeluarkan 11 baris; Yoru menyebut TEPAT SATU: "80(nginx)".
    Yang benar dibuang: mariadbd 127.0.0.1:3306; systemd-resolve di
    127.0.0.54:53 DAN di 127.0.0.53%lo:53; dua port X11 forwarding sshd di
    127.0.0.1:6010 dan :6011 berikut kembarannya di [::1]; port SSH di
    0.0.0.0:22 dan [::]:22. nginx yang mendengar di 0.0.0.0:80 dan [::]:80
    dilaporkan sekali, tidak dobel. Baris dengan dua proses sekaligus
    - ("sshd",pid=1063),("systemd",pid=1) - terbaca sebagai "sshd".
    Tiga bentuk ini tidak ada di uji tiruan dan baru muncul di mesin asli:
    akhiran "%lo", loopback IPv6 "[::1]", dan dua proses dalam satu baris.
  bukti_ujung_ke_ujung_dari_luar: >
    Rangkaian yang sama, diperiksa dari laptop di luar VM dengan perintah
    yang sama persis dua kali:
    sebelum -> "curl: (28) Connection timed out after 5007 milliseconds";
    terapkan -> DITOLAK "80(nginx)", ufw tidak disentuh;
    pemilik menjawab, port dicatat di /var/lib/yoru/port-disetujui;
    terapkan -> LULUS;
    sesudah -> "HTTP/1.1 200 OK, Server: nginx/1.24.0 (Ubuntu)".
    Di antara dua curl itu tidak ada satu pun perintah ufw yang diketik
    manusia - yang dilakukan pemilik hanya menjawab satu pertanyaan.
    ufw status verbose menunjukkan empat aturan dengan tanda yang dibedakan:
    22/tcp dan 22/tcp (v6) bertanda "SSH - yoru K05", 80/tcp dan 80/tcp (v6)
    bertanda "disetujui pemilik - yoru K05".
    periksa sesudahnya mengembalikan pesan null.

konflik_dengan_k10:
  ringkasan: >
    ufw TIDAK HANYA mengurus firewall. Dia juga menerapkan setelan
    kernel (sysctl) setiap kali servicenya start, dan salah satu
    setelannya bertabrakan langsung dengan K10.
  mekanisme: >
    /etc/default/ufw berisi IPT_SYSCTL=/etc/ufw/sysctl.conf. Setiap ufw
    start, dia menerapkan isi file itu. File tersebut memuat
    net/ipv4/conf/all/log_martians=0 dan .../default/log_martians=0.
    K10 menetapkan nilai 1 untuk keduanya.
  urutan_saat_boot: >
    systemd-sysctl jalan LEBIH DULU (menerapkan file K10, log_martians=1),
    lalu ufw start dan MENIMPA jadi 0. ufw menang karena belakangan.
  kenapa_tidak_ketahuan_saat_penerapan: >
    Saat kontrol diterapkan manual, ufw sudah berjalan lebih dulu, jadi
    sysctl -p milik K10 yang jalan belakangan dan MENANG. Semua verifikasi
    lulus. Kemenangan itu hanya bertahan sampai restart berikutnya.
    HANYA TES REBOOT yang bisa memperlihatkannya.
  bukti_sebab_akibat: >
    sysctl -w net.ipv4.conf.all.log_martians=1 -> nilai jadi 1
    systemctl restart ufw                      -> nilai kembali jadi 0
    Diuji di VM yoru-a, 4 Sep 2026. Bukan teori, sebab-akibat langsung.
  solusi: >
    Komentari baris IPT_SYSCTL di /etc/default/ufw supaya ufw berhenti
    mengurus sysctl, dan pindahkan seluruh tanggung jawab itu ke
    /etc/sysctl.d/ (K10). Aman karena dari sembilan baris aktif di
    /etc/ufw/sysctl.conf, delapan sudah diatur K10 dengan nilai yang sama,
    dan satu sisanya (icmp_echo_ignore_all=0) ditambahkan ke K10 supaya
    tidak ada setelan yang jatuh tanpa pemilik.
  prinsip: >
    SATU SETELAN, SATU PEMILIK. Setelan yang punya dua pengelola dengan
    perintah berbeda bukan konfigurasi - itu lomba lari, dan pemenangnya
    berubah tergantung urutan start layanan.
  pelajaran_untuk_agent: >
    Kontrol tidak boleh diperiksa hanya sesaat setelah diterapkan. Layanan
    lain bisa menimpanya saat boot berikutnya. Setiap kontrol yang
    menyentuh setelan bersama (sysctl, iptables, limits) WAJIB diuji ulang
    setelah reboot, bukan hanya setelah penerapan.
  ditemukan_pada: "VM yoru-a, 4 Sep 2026, lewat tes reboot check-all.sh"

batas_penting_pada_kembalikan:
  tingkat: WAJIB_DIBERITAHUKAN_KE_PEMILIK
  apa_yang_terjadi: >
    kembalikan menjalankan "ufw --force reset". Itu MENGHAPUS SEMUA aturan
    firewall di server, bukan hanya aturan yang dibuat Yoru. Aturan yang
    dipasang sendiri oleh pemilik server ikut hilang.
  kabar_baiknya: >
    ufw mengarsipkan berkas aturan lama sebelum menghapus, ke
    /etc/ufw/user.rules.<tanggal_jam>, user6.rules.<...>, after6.rules.<...>
    dan seterusnya. Terbukti di VM yoru-a 5 Sep 2026: setelah kembalikan,
    muncul tiga berkas bertanggal 20260905_160650. Jadi datanya tidak lenyap.
  kabar_buruknya: >
    Yoru TIDAK memulihkan dari arsip itu. Jadi setelah kembalikan, firewall
    berada dalam keadaan KOSONG - bukan kembali seperti sebelum Yoru
    dipasang. Untuk kontrol lain kata "kembalikan" berarti pulih ke keadaan
    semula; khusus di sini artinya lebih dekat ke "dikosongkan".
  yang_harus_dilakukan_agent: >
    Sebelum menjalankan kembalikan pada K05, beritahu pemilik bahwa aturan
    firewall miliknya akan ikut terhapus, dan sebutkan letak arsipnya supaya
    bisa dipulihkan manual. Jangan pakai kalimat "dikembalikan seperti
    semula" untuk kontrol ini.
  rencana_perbaikan: >
    Sebelum reset, salin user.rules dan user6.rules ke tempat milik Yoru,
    lalu kembalikan dari salinan itu. Belum dikerjakan.

diuji_pada: "Ubuntu 24.04, VM yoru-a, 3 Sep 2026; konflik sysctl ditemukan 4 Sep 2026; jalur dispatcher diuji 5 Sep 2026"
rollback_teruji: true
rollback_teruji_lewat_dispatcher: true
bukti_uji_dispatcher: >
  5 Sep 2026, VM yoru-a, yoructl 0.1.2:
  keadaan awal -> aktif, dua aturan 22/tcp bertanda "SSH - yoru K05";
  kembalikan   -> DIKEMBALIKAN "inactive", muncul tiga berkas arsip bertanggal;
  verifikasi   -> GAGAL "inactive";
  terapkan     -> LULUS "active";
  verifikasi   -> LULUS "active";
  ufw status verbose -> "deny (incoming), allow (outgoing)" dengan dua
  aturan 22/tcp. Sesi SSH yang sedang berjalan tidak terputus sama sekali.
port_ssh_tidak_dipatok:
  sejak: "yoructl 0.1.4"
  masalah_versi_lama: >
    terapkan memeriksa ":22 " lalu menjalankan "ufw allow 22/tcp". Itu benar
    di VM uji kami, dan salah di banyak VPS - penyedia sering memindahkan
    SSH ke port lain. CloudBaik, tempat proyek ini akan dipasang, memakai
    4422.
  akibatnya: >
    Di server seperti itu K05 berhenti dengan "sshd tidak terdeteksi di port
    22" dan tidak pernah bisa diterapkan. Penjaganya bekerja benar - dia
    memang mencegah firewall menyala tanpa jalan masuk - tapi hasilnya
    kontrol yang tidak pernah jalan, dan penolakannya terdengar wajar
    sehingga tidak ada yang curiga.
  sekarang: >
    Port dibaca dari "sshd -T | awk '/^port /{print $2}'" - dari sshd
    sendiri, bukan dari tebakan. Kalau sshd mendengar di lebih dari satu
    port, semuanya diizinkan.
  yang_tidak_berubah: >
    Port tetap harus BENAR-BENAR DIDENGAR, diperiksa lewat ss, bukan sekadar
    tertulis di konfigurasi. Menyalakan firewall berdasarkan niat dan bukan
    kenyataan adalah cara paling rapi mengunci diri sendiri di luar server.
    Dan port tetap diizinkan SEBELUM firewall dinyalakan.
  diuji: >
    Lima keadaan diuji 7 Sep 2026: sshd di 4422 saja; sshd di 22 saja; sshd
    di dua port sekaligus; konfigurasi menyebut port tapi tidak ada yang
    mendengar (harus DITOLAK); dan sshd -T tidak terbaca (harus DITOLAK).
    Diperiksa juga bahwa pola ":22 " tidak salah mengenali ":2222 " atau
    ":4422 ".
  diuji_ujung_ke_ujung: >
    7 Sep 2026, dengan sshd dan ufw tiruan yang menaruh sshd di 4422:
    periksa -> GAGAL "inactive"; terapkan -> LULUS "active" dan aturan yang
    terpasang berbunyi "ALLOW 4422/tcp" (bukan 22); verifikasi -> LULUS;
    kembalikan -> DIKEMBALIKAN "inactive".

penjaga_ufw_tidak_terpasang:
  sejak: "yoructl 0.1.4"
  masalah: >
    periksa sudah memeriksa keberadaan ufw sejak awal, tapi terapkan dan
    kembalikan belum. Keluaran semua perintah ufw dibuang ke /dev/null, jadi
    di server tanpa ufw semuanya gagal diam-diam, lalu status yang kosong
    dibaca sebagai "ufw gagal aktif".
  kenapa_itu_serius: >
    Sebabnya salah. Orang yang membacanya akan mencari alasan kenapa ufw
    menolak menyala, padahal ufw memang tidak ada. Ini jenis kesalahan yang
    sama dengan K07 dulu, yang melapor "periksa koneksi internet" padahal
    yang terjadi adalah apt sedang terkunci.
  sekarang: >
    terapkan berhenti lebih dulu dengan DITOLAK "ufw tidak terpasang - pasang
    dulu: apt-get install ufw", sebelum menyentuh apa pun. kembalikan menjawab
    DILEWATI "ufw tidak terpasang" - tidak ada yang perlu dikembalikan, dan
    melapor DIKEMBALIKAN dengan nilai kosong itu kabar bohong yang terdengar
    seperti keberhasilan.
  diuji: >
    7 Sep 2026, dibandingkan langsung. Versi tanpa penjaga menjawab
    "ufw gagal aktif"; versi 0.1.4 menjawab "ufw tidak terpasang".
    Diuji juga bahwa dengan ufw terpasang, keempat tindakan tetap berjalan
    seperti biasa.

catatan_urutan_terapkan: >
  Di dalam terapkan, port 22 diizinkan SEBELUM firewall dinyalakan, dan
  keberadaan sshd di port 22 diperiksa lebih dulu. Urutan ini tidak boleh
  dibalik. Menyalakan firewall dengan default tolak lalu baru membuka 22
  adalah cara klasik mengunci diri sendiri di luar server.
lulus_tes_reboot: true
