id: K02
nama: "Login pakai password dimatikan (SSH key saja)"
kode_cis: "5.2.11"
risiko: BERISIKO
kategori: ssh

kenapa: >
  Password bisa ditebak dengan brute force - mesin bisa mencoba jutaan
  kombinasi tanpa lelah. SSH key tidak bisa ditebak. Ini kontrol yang
  paling efektif menutup serangan brute force ke SSH.

prasyarat:
  - id: ssh_key_terpasang
    cek: "test -s /home/<user>/.ssh/authorized_keys"
    wajib: true
    kalau_gagal: BATALKAN
    alasan: >
      Tanpa SSH key yang sudah terpasang, mematikan login password
      menutup satu-satunya jalan masuk. Pemilik terkunci permanen.
  - id: key_terbukti_bisa_login
    cek: "journalctl -t sshd | grep -q 'Accepted publickey'"
    wajib: true
    kalau_gagal: BATALKAN
    alasan: >
      File authorized_keys ada belum tentu berarti key-nya berfungsi.
      Izin file salah atau pemilik file salah membuat SSH menolak key
      secara diam-diam. Harus ada bukti login publickey yang berhasil.
  - id: izin_file_benar
    cek: "stat -c '%a %U' /home/<user>/.ssh/authorized_keys"
    lolos_jika: "600 dan pemiliknya user tersebut, bukan root"
    wajib: true
    kalau_gagal: PERBAIKI_DULU

periksa:
  perintah: "sshd -T | awk '/^passwordauthentication/ {print $2}'"
  lolos_jika: "nilainya tepat 'no'"
  nilai_default_ubuntu: "yes"

status_awal_server_ini: GAGAL

terapkan:
  metode: drop-in
  file: "/etc/ssh/sshd_config.d/01-yoru-k02.conf"
  isi: "PasswordAuthentication no"
  validasi_sebelum_reload: "sshd -t"
  reload: "systemctl reload ssh"
  catatan_penamaan: >
    Awalan 01- WAJIB, bukan 60-. Lihat catatan_lingkungan di bawah.

kembalikan:
  perintah: "rm -f /etc/ssh/sshd_config.d/01-yoru-k02.conf"
  validasi_sebelum_reload: "sshd -t"
  reload: "systemctl reload ssh"

verifikasi:
  perintah: "sshd -T | awk '/^passwordauthentication/ {print $2}'"
  cek_layanan: "systemctl is-active ssh"
  cek_layanan_harus: "active"
  bukti_berfungsi: >
    Coba SSH dari klien yang tidak punya key. Server harus menolak
    dengan pesan "No supported authentication methods available
    (server sent: publickey)". Pesan ini eksplisit dan konklusif -
    berbeda dengan K01 yang alasan penolakannya sengaja disamarkan
    OpenSSH. Terbukti di VM yoru-a, 3 Sep 2026, klien MobaXterm.

catatan_lingkungan:
  masalah: >
    Ubuntu 24.04 mengirim file /etc/ssh/sshd_config.d/50-cloud-init.conf
    yang berisi "PasswordAuthentication yes".
  aturan_openssh: >
    Untuk setiap setelan, nilai PERTAMA yang ditemukan yang dipakai.
    Bukan yang terakhir. File di sshd_config.d dibaca urut abjad.
  akibat: >
    File bernama 60-yoru-k02.conf dibaca SETELAH 50-cloud-init.conf,
    jadi nilainya diabaikan total. File dibuat, sshd -t valid, reload
    tidak error - tapi setelan server sama sekali tidak berubah.
    Tiga tanda hijau di atas server yang masih terbuka.
  solusi: >
    Pakai awalan 01- supaya file kita dibaca lebih dulu. Jangan mengubah
    atau menghapus file cloud-init - itu bukan milik kita dan bisa
    ditulis ulang kapan saja oleh cloud-init.
  pelajaran_untuk_agent: >
    Kontrol tidak boleh dianggap berhasil hanya karena file berhasil
    ditulis dan reload tidak error. Verifikasi wajib membaca kembali
    kondisi efektif lewat sshd -T.
  ditemukan_pada: "VM yoru-a, Ubuntu 24.04, 3 Sep 2026"

yang_rusak_kalau_diterapkan: >
  Semua klien yang login pakai password berhenti bisa masuk. Termasuk
  script otomatis, tool backup, dan aplikasi yang menyimpan password SSH.
  Semua harus dipindah ke SSH key lebih dulu.

catatan_panel:
  aapanel: "aman, tapi pastikan admin sudah punya key sebelum diterapkan"
  cpanel: "aman, tapi fitur transfer akun antar-server sering pakai password"

bug_terparah_yang_pernah_ada:
  ditemukan: "5 Sep 2026, saat menguji jalur terapkan lewat dispatcher"
  versi_kena: "yoructl 0.1.0 dan 0.1.1 - yaitu sejak hari pertama ditulis"
  versi_perbaikan: "yoructl 0.1.2"
  tingkat: MEMATIKAN
  gejala: >
    terapkan selalu DITOLAK dengan pesan "belum ada bukti login SSH key
    berhasil". Padahal buktinya ada dan banyak: /etc/yoru/pemilik berisi
    "yoru", authorized_keys tidak kosong, dan journal memuat 25 baris
    "Accepted publickey for yoru". Keempat syaratnya lolos kalau diperiksa
    manual sebagai root.
  akar_masalah: >
    Baris 11 skrip ini memasang "set -uo pipefail". Prasyarat K02 memeriksa
    bukti dengan "journalctl ... | grep -q ...". grep -q berhenti begitu
    menemukan yang dicari lalu menutup pipa; journalctl yang masih punya
    ratusan baris untuk ditulis langsung mati kena SIGPIPE dengan kode 141;
    pipefail membaca 141 sebagai "seluruh pipa gagal".
  yang_bikin_ngeri: >
    Pemeriksaannya gagal JUSTRU KARENA buktinya ketemu. Dan kalau buktinya
    tidak ada, grep membaca sampai habis lalu mengembalikan 1 - juga gagal.
    Dua-duanya gagal. Fungsi kunci_ssh_terbukti() tidak pernah bisa
    mengembalikan sukses sekali pun, dalam keadaan apa pun. Artinya K02
    terapkan mati total sejak hari pertama, dan matinya berbentuk penolakan
    yang terdengar bijaksana - persis jenis kegagalan yang paling sulit
    dicurigai.
  kenapa_baru_ketahuan_sekarang: >
    Karena sampai 5 Sep 2026 yang pernah dijalankan lewat dispatcher hanya
    periksa dan verifikasi. Jalur terapkan tidak pernah dieksekusi sekali
    pun, jadi bug ini duduk diam di jalur yang belum pernah dilewati.
  dibuktikan_bagaimana: >
    Perintah identik dijalankan dua kali di VM yoru-a, hanya berbeda satu
    pengaturan:
    'set -uo pipefail; journalctl -t sshd --since "-30 days" | grep -q
    "Accepted publickey for yoru"' -> kode keluar 141;
    'set -u; <perintah yang sama>' -> kode keluar 0.
    Angka yang sama juga muncul di simulasi terpisah dengan keluaran besar.
  perbaikan: >
    Fungsi ada_teks() di bin/yoructl - menangkap keluaran perintah ke dalam
    variabel lalu mencocokkan dengan operator bash, tanpa pipa sama sekali.
    Pencocokannya harfiah seperti grep -F, bukan regex.
  berlaku_juga_di: >
    Pola "| grep -q" yang sama dipakai di lima tempat lain (K05 dua tempat,
    K06 tiga tempat). Kelimanya kebetulan selamat karena keluaran ufw dan ss
    cukup kecil untuk muat di penyangga pipa, sehingga penulisnya keburu
    selesai sebelum grep menutup pipa. Itu keberuntungan, bukan kebenaran -
    di server dengan sangat banyak port mendengar, keluaran ss bisa melewati
    batas dan K05 serta K06 mulai gagal secara acak. Kelimanya ikut diganti.
  pelajaran: >
    Bug yang paling berbahaya bukan yang bikin error, tapi yang bikin sistem
    menolak dengan alasan yang masuk akal. Tidak ada yang curiga pada penjaga
    yang berhati-hati. Satu-satunya cara menemukannya adalah menjalankan
    jalurnya sungguhan, bukan membacanya.

diuji_pada: "Ubuntu 24.04, VM yoru-a, 3 Sep 2026; jalur dispatcher diuji 5 Sep 2026"
rollback_teruji: true
rollback_teruji_lewat_dispatcher: true
bukti_uji_dispatcher: >
  5 Sep 2026, VM yoru-a. Dengan yoructl 0.1.1:
  kembalikan -> DIKEMBALIKAN "yes";
  verifikasi -> GAGAL "yes";
  terapkan   -> DITOLAK, prasyarat tidak pernah bisa lolos (lihat bug di atas).
  Setelah diperbaiki, dengan yoructl 0.1.2:
  verifikasi -> GAGAL "yes";
  terapkan   -> LULUS "no";
  verifikasi -> LULUS "no".
peringatan_untuk_server_bersama:
  masalah: >
    Prasyarat kunci_ssh_terbukti hanya memeriksa PEMILIK yang tercatat di
    /etc/yoru/pemilik. Kalau ada orang lain yang juga login ke server itu
    memakai password, K02 tidak akan tahu - dan begitu diterapkan, mereka
    terkunci di luar. Yang selamat hanya yang kuncinya terdaftar.
  kapan_ini_gawat: >
    Server yang dipakai bersama satu tim. Sebelum K02 diterapkan di server
    seperti itu, pastikan SEMUA orang yang perlu masuk sudah memasang kunci
    SSH dan sudah pernah memakainya untuk login minimal sekali.
  rencana_perbaikan: >
    Daftar pemilik dijadikan banyak baris, dan prasyaratnya memeriksa setiap
    baris. Belum dikerjakan.
